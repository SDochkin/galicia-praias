name: Update beaches

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15 * * *'
        run: pip install copernicusmarine

      - name: Fetch temperatures
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          METEOSIX_API_KEY: ${{ secrets.METEOSIX_API_KEY }}
        run: |
          set -e
          if [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            python3 scripts/update_beaches.py --skip-copernicus --skip-meteosix
          elif [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            python3 scripts/update_beaches.py --skip-copernicus --skip-mg --skip-aemet
          elif [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            python3 scripts/update_beaches.py --skip-meteosix
          else
            python3 scripts/update_beaches.py
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: update beach temperatures"
          git pull --rebase origin main
          git push
