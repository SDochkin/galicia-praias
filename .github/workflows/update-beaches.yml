name: Update beaches

on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "17 10 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-beaches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      METEOSIX_API_KEY: ${{ secrets.METEOSIX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 15 * * *'
        run: pip install copernicusmarine

      - name: Fetch Copernicus
        id: fetch_copernicus
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 15 * * *'
        run: python3 scripts/update_beaches.py --skip-meteosix --skip-mg --skip-aemet

      - name: Commit Copernicus
        if: >-
          (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 15 * * *')
          && steps.fetch_copernicus.outcome == 'success'
        env:
          REPLACE: Copernicus
        run: bash .github/scripts/commit-data.sh

      - name: Fetch MeteoSIX
        id: fetch_meteosix
        if: >-
          always()
          && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 10 * * *')
        run: python3 scripts/update_beaches.py --skip-copernicus --skip-mg --skip-aemet

      - name: Commit MeteoSIX
        if: >-
          always()
          && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 10 * * *')
          && steps.fetch_meteosix.outcome == 'success'
        env:
          REPLACE: MeteoSIX
        run: bash .github/scripts/commit-data.sh

      - name: Fetch layers
        id: fetch_layers
        if: >-
          always()
          && (github.event_name == 'workflow_dispatch'
          || github.event.schedule == '17 7 * * *')
        run: python3 scripts/update_beaches.py --skip-mg --skip-aemet --skip-meteosix --skip-copernicus

      - name: Commit layers
        if: >-
          always()
          && (github.event_name == 'workflow_dispatch'
          || github.event.schedule == '17 7 * * *')
          && steps.fetch_layers.outcome == 'success'
        env:
          REPLACE: Layers
        run: bash .github/scripts/commit-data.sh

      - name: Fetch MG
        id: fetch_mg
        if: >-
          always()
          && (github.event_name == 'workflow_dispatch'
          || github.event.schedule == '17 7 * * *'
          || github.event.schedule == '17 15 * * *')
        run: python3 scripts/update_beaches.py --skip-copernicus --skip-meteosix --skip-aemet

      - name: Commit MG
        if: >-
          always()
          && (github.event_name == 'workflow_dispatch'
          || github.event.schedule == '17 7 * * *'
          || github.event.schedule == '17 15 * * *')
          && steps.fetch_mg.outcome == 'success'
        env:
          REPLACE: MeteoGalicia
        run: bash .github/scripts/commit-data.sh

      - name: Fetch AEMET
        id: fetch_aemet
        if: >-
          always()
          && (github.event_name == 'workflow_dispatch'
          || github.event.schedule == '17 7 * * *'
          || github.event.schedule == '17 15 * * *')
        run: python3 scripts/update_beaches.py --skip-copernicus --skip-meteosix --skip-mg

      - name: Commit AEMET
        if: >-
          always()
          && (github.event_name == 'workflow_dispatch'
          || github.event.schedule == '17 7 * * *'
          || github.event.schedule == '17 15 * * *')
          && steps.fetch_aemet.outcome == 'success'
        env:
          REPLACE: AEMET
        run: bash .github/scripts/commit-data.sh
