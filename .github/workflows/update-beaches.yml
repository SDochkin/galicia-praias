name: Update beaches

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch temperatures
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python3 scripts/update_beaches.py

      - name: Commit beaches.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beaches.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: update beaches.json"
          git push
