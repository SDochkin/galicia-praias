<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temperatura del agua — playas de Galicia</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #9aabbc;
      --accent: #3db8a8;
      --warn: #e0a106;
      --border: #2a3542;
      --calida: #3dba6e;
      --templada: #d4b106;
      --fria: #e05252;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      touch-action: manipulation;
    }
    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 650;
      margin: 0 0 0.35rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.35rem; }
    .combo-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .combo {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    #geo-near {
      flex: 0 0 auto;
      min-width: 2.75rem;
      min-height: 2.75rem;
      padding: 0 0.7rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #geo-near:hover { border-color: var(--accent); }
    #geo-near:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    #concello {
      width: 100%;
      padding: 0.65rem 2.85rem 0.65rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    #concello:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    #concello-clear {
      position: absolute;
      right: 0.15rem;
      top: 50%;
      transform: translateY(-50%);
      min-width: 2.75rem;
      min-height: 2.75rem;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 0.35rem;
    }
    #concello-clear:hover { color: var(--text); }
    #concello-clear[hidden] { display: none; }
    #concello-listbox {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      top: calc(100% + 0.25rem);
      margin: 0;
      padding: 0.25rem;
      list-style: none;
      max-height: min(16rem, 50vh);
      overflow: auto;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }
    #concello-listbox[hidden] { display: none; }
    #concello-listbox [role="option"] {
      padding: 0.55rem 0.7rem;
      border-radius: 0.35rem;
      cursor: pointer;
    }
    #concello-listbox [role="option"][aria-selected="true"],
    #concello-listbox [role="option"]:hover {
      background: #24303c;
      color: var(--accent);
    }
    h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 1.4rem 0 0.55rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    h3 {
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0.85rem 0 0.45rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    ul.beach-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }
    @media (min-width: 32rem) {
      ul.beach-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 48rem) {
      ul.beach-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 0.65rem 0.7rem;
      border-radius: 0.55rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: inherit;
      height: 100%;
    }
    .card:hover, .card.is-flipped { border-color: var(--accent); }
    .card.band-calida { border-color: color-mix(in srgb, var(--calida) 55%, var(--border)); }
    .card.band-templada { border-color: color-mix(in srgb, var(--templada) 45%, var(--border)); }
    .card.band-fria { border-color: color-mix(in srgb, var(--fria) 55%, var(--border)); }
    .card-face {
      display: flex;
      align-items: flex-start;
      gap: 0.25rem;
    }
    .card-flip {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .card-flip:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 2px;
      border-radius: 0.25rem;
    }
    .card-name {
      font-weight: 550;
      min-width: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
    }
    .card-city { color: var(--muted); font-size: 0.78rem; font-weight: 400; }
    .card-metrics {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      margin-top: 0.3rem;
      font-variant-numeric: tabular-nums;
    }
    .card-score {
      font-weight: 650;
      font-size: 1.15rem;
    }
    .card-temp {
      font-weight: 650;
      white-space: nowrap;
    }
    .card-more {
      display: inline-block;
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.75rem;
    }
    .temp.band-calida { color: var(--calida); }
    .temp.band-templada { color: var(--templada); }
    .temp.band-fria { color: var(--fria); }
    .trend { margin-left: 0.25rem; font-weight: 700; }
    .hint {
      flex: 0 0 auto;
      min-width: 2.75rem;
      min-height: 2.75rem;
      display: grid;
      place-items: center;
      color: var(--warn);
      cursor: help;
      font-weight: 700;
      border: 0;
      background: transparent;
      padding: 0;
      font-size: 0.9rem;
      line-height: 1;
    }
    .card-back {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      max-height: min(16rem, 70vh);
      overflow: auto;
    }
    .card-facts {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
    }
    .card-facts li {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.15rem 0;
    }
    .ico {
      flex: 0 0 1em;
      width: 1em;
      height: 1em;
    }
    .uv-warn { color: var(--warn); margin: 0.35rem 0 0.45rem; }
    .card-back details { margin-top: 0.5rem; }
    .card-back summary {
      min-height: 2.75rem;
      display: flex;
      align-items: center;
      cursor: pointer;
      color: var(--text);
      font-weight: 600;
    }
    .card-back summary:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 2px;
      border-radius: 0.25rem;
    }
    .card-back h4 {
      margin: 0.75rem 0 0.25rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .card-back table { table-layout: fixed; width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .card-back th, .card-back td {
      text-align: left;
      padding: 0.35rem 0.25rem;
      border-bottom: 1px solid var(--border);
    }
    .card-back th:not(:first-child),
    .card-back td:not(:first-child) {
      width: 4.75rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .maps {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      min-width: 2.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 0.55rem;
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .maps:hover { border-color: var(--accent); }
    #tip {
      position: fixed;
      z-index: 40;
      max-width: min(18rem, calc(100vw - 1.5rem));
      padding: 0.55rem 0.7rem;
      border-radius: 0.45rem;
      border: 1px solid var(--warn);
      background: #2a2414;
      color: #f5e6b8;
      font-size: 0.82rem;
      line-height: 1.35;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    #tip[hidden] { display: none; }
    footer {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); }
    .empty { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Temperatura del agua</h1>
    <p class="sub">Temperatura del agua en playas de Galicia. No son mediciones in situ en la orilla.</p>
    <label for="concello">Concello</label>
    <div class="combo-row">
    <div class="combo">
      <input
        id="concello"
        role="combobox"
        aria-expanded="false"
        aria-controls="concello-listbox"
        aria-autocomplete="list"
        autocomplete="off"
        placeholder="Buscar concello…"
      />
      <button type="button" id="concello-clear" hidden aria-label="Limpiar">×</button>
      <ul id="concello-listbox" role="listbox" hidden></ul>
    </div>
    <button type="button" id="geo-near" aria-label="Playas cercanas">Cerca</button>
    </div>
    <p id="geo-status" class="empty" aria-live="polite" hidden></p>
    <div id="lists"></div>
    <footer>
      Datos:
      <a href="https://marine.copernicus.eu/" rel="noopener">E.U. Copernicus Marine Service</a>,
      <a href="https://www.meteogalicia.gal/" rel="noopener">MeteoGalicia</a>
      /
      <a href="https://www.meteogalicia.gal/web/modelos-numericos/meteosix" rel="noopener">MeteoSIX</a>
      y
      <a href="https://www.aemet.es/" rel="noopener">AEMET</a>.
      Licencias: <a href="DATA-LICENSE.md">por fuente</a>.
      Actualizado: <span id="fetchedAt">—</span>.
    </footer>
  </main>
  <div id="tip" hidden role="tooltip"></div>
  <script>
    const BANDS = [
      { id: "calida", title: "Cálida", cls: "band-calida" },
      { id: "templada", title: "Templada", cls: "band-templada" },
      { id: "fria", title: "Fría", cls: "band-fria" },
    ];

    const SCORE_PARTS = {
      water: "Agua",
      air: "Aire",
      wind: "Viento",
      waves: "Oleaje",
      rain: "Lluvia",
    };
    const SCORE_PART_ICONS = {
      water: "water",
      air: "air",
      wind: "wind",
      waves: "waves",
      rain: "rain",
    };
    const GEO_RADIUS_KM = 30;
    const GEO_CAP = 10;

    let index = { fetchedAt: "", concellos: [], beachConcello: {}, top: [], geo: [] };
    let refDay = "";
    let currentConcello = null;
    let currentBeach = null;
    let geoMode = false;
    let geoResults = [];
    const concelloCache = new Map();
    let tipOpen = false;
    let tipOwner = null;

    function track(name, data) {
      // Event names are an invariant: concello_select, top_view, beach_open,
      // maps_open, hint_open. These are accumulated Umami series; renaming
      // an event splits the stats. New field values inside an event are safe.
      if (typeof umami !== "undefined" && umami.track) umami.track(name, data);
    }

    function setUrl(params, { replace = false } = {}) {
      const clean = {};
      for (const [k, v] of Object.entries(params || {})) {
        if (v != null && v !== "") clean[k] = v;
      }
      const q = new URLSearchParams(clean).toString();
      const url = q ? `?${q}` : location.pathname;
      if (replace) history.replaceState(null, "", url);
      else history.pushState(null, "", url);
    }

    function parseQuery() {
      const p = new URLSearchParams(location.search);
      return { c: p.get("c"), b: p.get("b") };
    }

    function dayOf(iso) {
      return (iso || "").slice(0, 10);
    }

    function formatDateEs(isoDay) {
      if (!isoDay) return "";
      const [y, m, d] = isoDay.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString("es-ES", { day: "numeric", month: "long" });
    }

    const dayFmt = new Intl.DateTimeFormat("es-ES", {
      weekday: "short",
      day: "numeric",
    });

    function formatDay(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return dayFmt.format(new Date(y, m - 1, d));
    }

    function fmtT(t) {
      return Number(t).toLocaleString("es-ES", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1,
      });
    }

    function bandFor(t) {
      if (typeof t !== "number") return null;
      if (t >= 20) return BANDS[0];
      if (t >= 17) return BANDS[1];
      return BANDS[2];
    }

    function dayEntry(days, day) {
      return (days || []).find(
        (d) => d && d.date === day && typeof d.t === "number"
      );
    }

    function costaOf(beach) {
      if (!beach.source || beach.source === "Copernicus") return null;
      if (typeof beach.t !== "number") return null;
      return { name: beach.source, t: beach.t };
    }

    function marOf(beach) {
      const s = (beach.sources || []).find((x) => x.name === "Copernicus");
      if (!s) return null;
      const d = dayEntry(s.days, refDay);
      return d ? { name: "Copernicus", t: d.t } : null;
    }

    function disagree(beach) {
      const costa = costaOf(beach);
      const mar = marOf(beach);
      if (!costa || !mar) return false;
      return Math.abs(costa.t - mar.t) >= 3;
    }

    function disagreeText(beach) {
      const costa = costaOf(beach);
      const mar = marOf(beach);
      return (
        `Costa ${fmtT(costa.t)} °C (${costa.name}) · Mar ${fmtT(mar.t)} °C (${mar.name}): ` +
        `dos fuentes distintas; no son el mismo dato.`
      );
    }

    function lastKnown(beach) {
      let best = null;
      for (const s of beach.sources || []) {
        for (const d of [...(s.history || []), ...(s.days || [])]) {
          if (!d || typeof d.t !== "number" || !d.date) continue;
          if (refDay && d.date >= refDay) continue;
          if (!best || d.date > best.date) {
            best = { date: d.date, t: d.t, name: s.name };
          }
        }
      }
      return best;
    }

    function dashTip(beach) {
      const last = lastKnown(beach);
      if (!last) return "Sin dato de hoy.";
      return `Sin dato de hoy. Último: ${formatDateEs(last.date)} — ${last.name} ${fmtT(last.t)} °C`;
    }

    function trendGlyph(trend) {
      if (trend === "up") return "↑";
      if (trend === "down") return "↓";
      if (trend === "flat") return "→";
      return "";
    }

    function trendLabel(trend) {
      if (trend === "up") return "subiendo";
      if (trend === "down") return "bajando";
      if (trend === "flat") return "estable";
      return "";
    }

    function concelloName(slug) {
      if (!slug) return "";
      const hit = index.concellos.find((c) => c.slug === slug);
      return hit ? hit.name : slug;
    }

    let comboActive = -1;
    let comboFiltered = [];

    function syncClearButton() {
      const input = document.getElementById("concello");
      const btn = document.getElementById("concello-clear");
      btn.hidden = !input.value.trim();
    }

    function setConcelloInput() {
      const input = document.getElementById("concello");
      input.value = currentConcello ? concelloName(currentConcello) : "";
      syncClearButton();
    }

    function sortedConcellos() {
      return [...index.concellos].sort((a, b) =>
        a.name.localeCompare(b.name, "es")
      );
    }

    function filterConcellos(raw) {
      const q = (raw || "").trim().toLowerCase();
      const items = sortedConcellos();
      if (!q) return items;
      return items.filter((c) => c.name.toLowerCase().includes(q));
    }

    function closeCombo() {
      const input = document.getElementById("concello");
      const list = document.getElementById("concello-listbox");
      list.hidden = true;
      input.setAttribute("aria-expanded", "false");
      input.removeAttribute("aria-activedescendant");
      comboActive = -1;
    }

    function openCombo() {
      const input = document.getElementById("concello");
      const list = document.getElementById("concello-listbox");
      list.hidden = false;
      input.setAttribute("aria-expanded", "true");
    }

    function renderComboOptions(query) {
      const list = document.getElementById("concello-listbox");
      comboFiltered = filterConcellos(query);
      if (!comboFiltered.length) {
        list.innerHTML =
          '<li role="presentation" class="empty" style="padding:0.55rem 0.7rem">Sin resultados</li>';
        comboActive = -1;
        openCombo();
        return;
      }
      list.innerHTML = comboFiltered
        .map(
          (c, i) =>
            `<li role="option" id="concello-opt-${i}" data-slug="${c.slug}">${c.name}</li>`
        )
        .join("");
      comboActive = -1;
      openCombo();
    }

    function setComboActive(i) {
      const list = document.getElementById("concello-listbox");
      const input = document.getElementById("concello");
      const opts = [...list.querySelectorAll('[role="option"]')];
      if (!opts.length) return;
      comboActive = ((i % opts.length) + opts.length) % opts.length;
      opts.forEach((el, idx) => {
        el.setAttribute("aria-selected", idx === comboActive ? "true" : "false");
      });
      const active = opts[comboActive];
      input.setAttribute("aria-activedescendant", active.id);
      active.scrollIntoView({ block: "nearest" });
    }

    function ensureConcelloReady() {
      if (currentConcello === null) {
        setConcelloInput();
        return;
      }
      const items = sortedConcellos();
      if (!items.some((c) => c.slug === currentConcello) && items.length) {
        currentConcello = items[0].slug;
      }
      setConcelloInput();
    }

    async function selectConcello(slug) {
      geoMode = false;
      setGeoStatus("");
      if (!slug || slug === currentConcello) {
        setConcelloInput();
        closeCombo();
        await renderLists();
        return;
      }
      currentConcello = slug;
      currentBeach = null;
      geoMode = false;
      hideTip();
      setConcelloInput();
      closeCombo();
      setUrl({ c: currentConcello });
      track("concello_select", { slug: currentConcello });
      await renderLists();
    }

    async function clearConcello() {
      geoMode = false;
      setGeoStatus("");
      currentConcello = null;
      currentBeach = null;
      geoMode = false;
      hideTip();
      setConcelloInput();
      closeCombo();
      setUrl({});
      track("top_view");
      await renderLists();
    }

    async function loadConcello(slug) {
      if (concelloCache.has(slug)) return concelloCache.get(slug);
      const r = await fetch(`./data/${slug}.json`, { cache: "no-store" });
      if (!r.ok) throw new Error(`${r.status}`);
      const json = await r.json();
      concelloCache.set(slug, json);
      return json;
    }

    function hideTip() {
      tipOpen = false;
      tipOwner = null;
      const tip = document.getElementById("tip");
      tip.hidden = true;
      tip.textContent = "";
      document.querySelectorAll(".hint[aria-describedby='tip']").forEach((el) => {
        el.removeAttribute("aria-describedby");
      });
    }

    function showTip(btn, text, clientX, clientY) {
      const tip = document.getElementById("tip");
      tip.textContent = text;
      tip.hidden = false;
      tipOpen = true;
      tipOwner = btn;
      document.querySelectorAll(".hint[aria-describedby='tip']").forEach((el) => {
        el.removeAttribute("aria-describedby");
      });
      btn.setAttribute("aria-describedby", "tip");
      const pad = 12;
      let x = clientX + 10;
      let y = clientY + 10;
      tip.style.left = "0px";
      tip.style.top = "0px";
      const rect = tip.getBoundingClientRect();
      if (x + rect.width > window.innerWidth - pad) {
        x = Math.max(pad, clientX - rect.width - 10);
      }
      if (y + rect.height > window.innerHeight - pad) {
        y = Math.max(pad, clientY - rect.height - 10);
      }
      tip.style.left = `${x}px`;
      tip.style.top = `${y}px`;
    }

    function canHover() {
      return window.matchMedia("(hover: hover)").matches;
    }

    function bindHint(btn) {
      const text = btn.dataset.tip || "";

      btn.addEventListener("mouseenter", (e) => {
        if (!canHover()) return;
        showTip(btn, text, e.clientX, e.clientY);
      });
      btn.addEventListener("mousemove", (e) => {
        if (!canHover() || !tipOpen) return;
        showTip(btn, text, e.clientX, e.clientY);
      });
      btn.addEventListener("mouseleave", () => {
        if (!canHover()) return;
        hideTip();
      });
      btn.addEventListener("focus", () => {
        const r = btn.getBoundingClientRect();
        showTip(btn, text, r.left + r.width / 2, r.bottom);
      });
      btn.addEventListener("blur", () => hideTip());
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (tipOpen && tipOwner === btn) {
          hideTip();
          return;
        }
        track("hint_open", { kind: btn.dataset.kind || "disagree" });
        const r = btn.getBoundingClientRect();
        showTip(btn, text, r.left + r.width / 2, r.bottom);
      });
    }

    function setGeoStatus(msg) {
      const el = document.getElementById("geo-status");
      if (!el) return;
      if (!msg) {
        el.hidden = true;
        el.textContent = "";
        return;
      }
      el.hidden = false;
      el.textContent = msg;
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const rad = (d) => (d * Math.PI) / 180;
      const dLat = rad(lat2 - lat1);
      const dLon = rad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function nearbyBeaches(lat, lon) {
      const rows = (index.geo || []).filter((b) => typeof b.score === "number");
      const hit = [];
      for (const b of rows) {
        if (typeof b.lat !== "number" || typeof b.lon !== "number") continue;
        const km = haversineKm(lat, lon, b.lat, b.lon);
        if (km <= GEO_RADIUS_KM) hit.push({ ...b, km });
      }
      hit.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "es"));
      return hit.slice(0, GEO_CAP);
    }

    function beachConcelloLabel(beach) {
      return (
        beach.concello ||
        concelloName(index.beachConcello[beach.slug] || beach.concelloSlug)
      );
    }

    function seriesByDay(src) {
      const m = new Map();
      if (!src) return m;
      for (const d of [...(src.history || []), ...(src.days || [])]) {
        if (d && d.date && typeof d.t === "number") m.set(d.date, d.t);
      }
      return m;
    }

    function uvLabel(uv) {
      if (typeof uv !== "number") return "";
      if (uv <= 2) return "bajo";
      if (uv <= 5) return "moderado";
      if (uv <= 7) return "alto";
      if (uv <= 10) return "muy alto";
      return "extremo";
    }

    function accordionTable(title, dates, costaDays, marDays, uvDays, costaName) {
      if (!dates.length) return "";
      const showCosta = costaDays.size > 0;
      const showMar = marDays.size > 0;
      const showUV = dates.some((d) => uvDays.has(d));
      if (!showCosta && !showMar && !showUV) return "";
      const costaTitle = costaName ? `Según ${costaName}` : "";
      const heads = ["<th>Día</th>"];
      if (showCosta) {
        heads.push(`<th title="${escapeAttr(costaTitle)}">Costa</th>`);
      }
      if (showMar) {
        heads.push(
          `<th title="${escapeAttr("Según Copernicus")}">Mar</th>`
        );
      }
      if (showUV) {
        heads.push(
          `<th title="${escapeAttr("Índice UV máximo del día (OMS)")}">UV</th>`
        );
      }
      const rows = dates.map((d) => {
        const cells = [`<td>${formatDay(d)}</td>`];
        if (showCosta) {
          const t = costaDays.get(d);
          cells.push(`<td>${t == null ? "—" : `${fmtT(t)} °C`}</td>`);
        }
        if (showMar) {
          const t = marDays.get(d);
          cells.push(`<td>${t == null ? "—" : `${fmtT(t)} °C`}</td>`);
        }
        if (showUV) {
          const uv = uvDays.get(d);
          cells.push(
            `<td>${typeof uv === "number" ? `${uv} ${uvLabel(uv)}` : "—"}</td>`
          );
        }
        return `<tr>${cells.join("")}</tr>`;
      });
      return (
        `<h4>${title}</h4><table><thead><tr>${heads.join("")}</tr></thead>` +
        `<tbody>${rows.join("")}</tbody></table>`
      );
    }

    function madridClock(scoreDay, utcHour) {
      if (typeof utcHour !== "number" || !scoreDay) return "";
      const [y, m, d] = scoreDay.split("-").map(Number);
      for (const delta of [0, -1, 1]) {
        const dt = new Date(Date.UTC(y, m - 1, d + delta, utcHour));
        const md = dt.toLocaleString("sv-SE", { timeZone: "Europe/Madrid" }).slice(0, 10);
        if (md === scoreDay) {
          return dt.toLocaleString("es-ES", {
            timeZone: "Europe/Madrid",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          });
        }
      }
      return `${String(utcHour).padStart(2, "0")}:00`;
    }

    function prefersReducedMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function scoreColor(score) {
      const s = Math.max(0, Math.min(100, Number(score))) / 100;
      const fria = [224, 82, 82];
      const templada = [232, 196, 48];
      const calida = [61, 186, 110];
      const lerp = (a, b, t) => a.map((c, i) => Math.round(c + (b[i] - c) * t));
      const rgb = s < 0.5 ? lerp(fria, templada, s / 0.5) : lerp(templada, calida, (s - 0.5) / 0.5);
      return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
    }

    function iconSvg(name) {
      const paths = {
        indice:
          '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        clock:
          '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',
        water:
          '<path d="M12 3s7 8 7 12a7 7 0 1 1-14 0c0-4 7-12 7-12z"/>',
        air: '<path d="M14 4v16M10 8h4M10 16h4"/><path d="M14 8a2.5 2.5 0 1 1 0 5"/>',
        wind: '<path d="M3 10h11a3 3 0 1 0-3-3M3 14h8a2.5 2.5 0 1 1-2.5 2.5"/>',
        waves: '<path d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/>',
        rain: '<path d="M8 6a5 5 0 0 1 9 3h1a3.5 3.5 0 1 1 0 7H7a4 4 0 0 1-1-7.9"/><path d="M8 18v2M12 17v3M16 18v2"/>',
        sea: '<path d="M3 13c2 2 4 2 6 0s4-2 6 0 4 2 6 0M3 18c2 2 4 2 6 0s4-2 6 0 4 2 6 0"/>',
      };
      const d = paths[name];
      if (!d) return "";
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    }

    function factItem(icon, label, value) {
      return `<li>${iconSvg(icon)}<span>${label} ${value}</span></li>`;
    }

    function uvMap(beach) {
      const mgSrc = (beach.sources || []).find((s) => s.name === "MeteoGalicia");
      const uvDays = new Map();
      for (const d of (mgSrc && mgSrc.days) || []) {
        if (d && d.date && typeof d.uv === "number") uvDays.set(d.date, d.uv);
      }
      return uvDays;
    }

    function cardBackHtml(beach) {
      const costaSrc =
        beach.source && beach.source !== "Copernicus"
          ? (beach.sources || []).find((s) => s.name === beach.source)
          : null;
      const marSrc = (beach.sources || []).find((s) => s.name === "Copernicus");
      const costaDays = seriesByDay(costaSrc);
      const marDays = seriesByDay(marSrc);
      const uvDays = uvMap(beach);
      const allDates = [
        ...new Set([...costaDays.keys(), ...marDays.keys(), ...uvDays.keys()]),
      ].sort();
      const histDates = allDates.filter((d) => d < refDay);
      const futDates = allDates.filter((d) => d >= refDay);
      const facts = [];
      if (typeof beach.score === "number") {
        facts.push(factItem("indice", "Índice", String(beach.score)));
        const best = madridClock(beach.scoreDay, beach.bestHour);
        const win = beach.scoreWindow
          ? `${madridClock(beach.scoreDay, beach.scoreWindow.from)}–${madridClock(beach.scoreDay, beach.scoreWindow.to)}`
          : "";
        facts.push(factItem("clock", "Mejor hora", best || "—"));
        facts.push(factItem("clock", "Ventana", win || "—"));
        const parts = beach.scoreParts || {};
        for (const k of Object.keys(SCORE_PARTS)) {
          if (typeof parts[k] === "number") {
            facts.push(factItem(SCORE_PART_ICONS[k], SCORE_PARTS[k], String(parts[k])));
          }
        }
      }
      const mar = marOf(beach);
      if (mar) facts.push(factItem("sea", "Mar", `${fmtT(mar.t)} °C`));
      const bits = [];
      if (facts.length) bits.push(`<ul class="card-facts">${facts.join("")}</ul>`);
      const todayUv = uvDays.get(refDay);
      if (typeof todayUv === "number" && todayUv >= 8) {
        bits.push(`<p class="uv-warn">UV muy alto: usa protección solar.</p>`);
      }
      const tables = [
        accordionTable("Histórico", histDates, costaDays, marDays, uvDays, costaSrc ? beach.source : ""),
        accordionTable("Pronóstico", futDates, costaDays, marDays, uvDays, costaSrc ? beach.source : ""),
      ].join("");
      if (tables) {
        bits.push(
          `<details><summary>Histórico y pronóstico</summary>${tables}</details>`
        );
      }
      return bits.join("");
    }

    function escapeAttr(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function todaySourceCount(beach) {
      return (beach.sources || []).filter((s) => dayEntry(s.days, refDay)).length;
    }

    function cardHtml(beach, { showConcello = false } = {}) {
      const costa = costaOf(beach);
      const mar = marOf(beach);
      const hasT = typeof beach.t === "number";
      const hasScore = typeof beach.score === "number";
      const band = hasT ? bandFor(beach.t) : null;
      const bandCls = band ? band.cls : "";
      let tipBtn = "";
      if (hasT && disagree(beach)) {
        tipBtn = `<button type="button" class="hint" data-kind="disagree" data-tip="${escapeAttr(
          disagreeText(beach)
        )}" aria-label="Fuentes discrepan">?</button>`;
      } else if (!hasT && (beach.sources || []).length) {
        tipBtn = `<button type="button" class="hint" data-kind="nodata" data-tip="${escapeAttr(
          dashTip(beach)
        )}" aria-label="Sin dato de hoy">?</button>`;
      } else if (todaySourceCount(beach) === 1) {
        tipBtn = `<button type="button" class="hint" data-kind="single" data-tip="${escapeAttr(
          "Solo una fuente tiene dato de hoy: no hay con qué comparar."
        )}" aria-label="Una sola fuente">?</button>`;
      }
      const trendName = hasT ? trendLabel(beach.trend) : "";
      const g = hasT ? trendGlyph(beach.trend) : "";
      const trend = g
        ? `<span class="trend" aria-label="${escapeAttr(trendName)}">${g}</span>`
        : "";
      const open = currentBeach === beach.slug;
      const expanded = open ? "true" : "false";
      const tempText = hasT ? `${fmtT(beach.t)} °C${trend}` : "—";
      const tempTitle = costa
        ? `Según ${costa.name}`
        : mar
          ? "Según Copernicus"
          : "";
      const concello = beachConcelloLabel(beach);
      const q = encodeURIComponent(`${beach.name}, ${concello}, Galicia`);
      const city = showConcello && concello
        ? ` <span class="card-city">${concello}</span>`
        : "";
      const scoreHtml = hasScore
        ? `<span class="card-score" style="color:${scoreColor(beach.score)}" title="Índice ${beach.score}" aria-label="Índice ${beach.score}">${beach.score}</span>`
        : `<span class="card-score" aria-label="Índice —">—</span>`;
      const btnId = `flip-${beach.slug}`;
      const backId = `back-${beach.slug}`;
      const back = open
        ? `<div class="card-back" id="${backId}" role="region" aria-labelledby="${btnId}">${cardBackHtml(
            beach
          )}</div>`
        : "";
      return `<li>
        <article class="card ${bandCls}${open ? " is-flipped" : ""}" data-slug="${beach.slug}">
          <div class="card-face">
              <button type="button" class="card-flip" id="${btnId}" data-slug="${beach.slug}" aria-expanded="${expanded}"${
                open ? ` aria-controls="${backId}"` : ""
              } aria-label="Detalles, ${escapeAttr(beach.name)}">
              <span class="card-name">${beach.name}${city}</span>
              <span class="card-metrics">${scoreHtml}<span class="card-temp temp ${bandCls}"${
                tempTitle ? ` title="${escapeAttr(tempTitle)}"` : ""
              }>${tempText}</span></span>
              <span class="card-more">${open ? "Ocultar detalles" : "Detalles"}</span>
            </button>
            ${tipBtn}
            <a class="maps" target="_blank" rel="noopener" data-slug="${beach.slug}" href="https://www.google.com/maps/search/?api=1&amp;query=${q}">Mapa</a>
          </div>
          ${back}
        </article>
      </li>`;
    }

    function sortBeaches(items) {
      return [...items].sort((a, b) => {
        if (typeof a.t === "number" && typeof b.t === "number" && b.t !== a.t) {
          return b.t - a.t;
        }
        return a.name.localeCompare(b.name, "es");
      });
    }

    function renderBanded(beaches, { showConcello = false } = {}) {
      const withT = beaches.filter((b) => typeof b.t === "number");
      const withoutT = beaches.filter(
        (b) => typeof b.t !== "number" && ((b.sources || []).length || typeof b.score === "number")
      );
      const parts = [];
      for (const band of BANDS) {
        const items = sortBeaches(
          withT.filter((b) => bandFor(b.t)?.id === band.id)
        );
        if (!items.length) continue;
        parts.push(
          `<section><h3>${band.title}</h3><ul class="beach-list">${items
            .map((b) => cardHtml(b, { showConcello }))
            .join("")}</ul></section>`
        );
      }
      if (withoutT.length) {
        const items = [...withoutT].sort((a, b) =>
          a.name.localeCompare(b.name, "es")
        );
        parts.push(
          `<section><h3>Sin dato de hoy</h3><ul class="beach-list">${items
            .map((b) => cardHtml(b, { showConcello }))
            .join("")}</ul></section>`
        );
      }
      return parts;
    }

    function bindList(root) {
      root.querySelectorAll("button.card-flip").forEach((btn) => {
        btn.addEventListener("click", () => {
          const slug = btn.dataset.slug;
          if (!slug) return;
          if (currentBeach === slug) closeBeach();
          else openBeach(slug, { from: geoMode ? "geo" : undefined });
        });
      });
      root.querySelectorAll("button.hint").forEach(bindHint);
      root.querySelectorAll("a.maps").forEach((a) => {
        a.addEventListener("click", () => {
          track("maps_open", { slug: a.dataset.slug });
        });
      });
    }

    async function enrichTopBeach(beach) {
      if ((beach.sources || []).some((s) => s.history)) return beach;
      const cslug = index.beachConcello[beach.slug] || beach.concelloSlug;
      if (!cslug) return beach;
      try {
        const payload = await loadConcello(cslug);
        const full = (payload.beaches || []).find((b) => b.slug === beach.slug);
        if (full) {
          return {
            ...beach,
            ...full,
            concello: beach.concello || beachConcelloLabel(beach),
            concelloSlug: cslug,
          };
        }
      } catch (_) {
        /* keep slim */
      }
      return beach;
    }

    async function renderLists() {
      const root = document.getElementById("lists");

      if (geoMode) {
        if (currentBeach) {
          const idx = geoResults.findIndex((b) => b.slug === currentBeach);
          if (idx >= 0) {
            geoResults[idx] = await enrichTopBeach(geoResults[idx]);
          }
        }
        const items = geoResults
          .map((b) => cardHtml(b, { showConcello: true }))
          .join("");
        root.innerHTML = `<h2>Playas cercanas</h2><ul class="beach-list">${items}</ul>`;
        bindList(root);
        return;
      }

      if (currentConcello === null) {
        let top = [...(index.top || [])];
        if (currentBeach) {
          const idx = top.findIndex((b) => b.slug === currentBeach);
          if (idx >= 0) {
            top[idx] = await enrichTopBeach(top[idx]);
          }
        }
        const parts = renderBanded(top, { showConcello: true });
        root.innerHTML = parts.length
          ? `<h2>Las más cálidas</h2>${parts.join("")}`
          : '<p class="empty">Sin destacadas.</p>';
        bindList(root);
        return;
      }

      if (!concelloCache.has(currentConcello)) {
        root.innerHTML = '<p class="empty">Cargando…</p>';
      }

      let payload;
      try {
        payload = await loadConcello(currentConcello);
      } catch (err) {
        root.innerHTML = `<p class="empty">No se pudo cargar ${currentConcello} (${err.message}).</p>`;
        return;
      }
      const beaches = payload.beaches || [];
      const parts = renderBanded(beaches, { showConcello: false });
      root.innerHTML =
        parts.join("") || '<p class="empty">Sin datos para este concello.</p>';
      bindList(root);
    }

    async function openBeach(slug, { push = true, from } = {}) {
      currentBeach = slug;
      if (push) {
        const src = from || (geoMode ? "geo" : currentConcello ? "concello" : "top");
        track("beach_open", { slug, from: src });
        if (currentConcello && !geoMode) setUrl({ c: currentConcello, b: slug });
      }
      await renderLists();
      const card = document.querySelector(`.card[data-slug="${CSS.escape(slug)}"]`);
      if (card) {
        card.scrollIntoView({
          block: "nearest",
          behavior: prefersReducedMotion() ? "auto" : "smooth",
        });
      }
    }

    function closeBeach({ push = true } = {}) {
      currentBeach = null;
      hideTip();
      if (push && !geoMode) {
        if (currentConcello === null) setUrl({});
        else setUrl({ c: currentConcello });
      }
      renderLists();
    }

    async function bootFromQuery() {
      const { c, b } = parseQuery();
      if (b && index.beachConcello[b]) {
        currentConcello = index.beachConcello[b];
      } else if (c) {
        currentConcello = c;
      } else {
        currentConcello = null;
      }
      ensureConcelloReady();
      if (!c && !b) track("top_view");
      if (b) await openBeach(b, { push: false });
      else await renderLists();
    }

    const concelloInput = document.getElementById("concello");
    const concelloList = document.getElementById("concello-listbox");
    const concelloClear = document.getElementById("concello-clear");

    concelloClear.addEventListener("click", (e) => {
      e.preventDefault();
      clearConcello();
    });

    document.getElementById("geo-near").addEventListener("click", () => {
      if (!navigator.geolocation) {
        geoMode = false;
        geoResults = [];
        setGeoStatus("No se pudo obtener tu ubicación.");
        return;
      }
      setGeoStatus("Obteniendo ubicación…");
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const near = nearbyBeaches(pos.coords.latitude, pos.coords.longitude);
          if (!near.length) {
            geoMode = false;
            geoResults = [];
            setGeoStatus("No hay playas con índice a menos de 30 km.");
            await renderLists();
            return;
          }
          currentConcello = null;
          setConcelloInput();
          setGeoStatus("");
          geoMode = true;
          geoResults = near;
          currentBeach = null;
          await renderLists();
        },
        async () => {
          geoMode = false;
          geoResults = [];
          setGeoStatus("No se pudo obtener tu ubicación.");
          await renderLists();
        }
      );
    });

    concelloInput.addEventListener("focus", () => {
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("click", () => {
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("input", () => {
      syncClearButton();
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("keydown", async (e) => {
      const open = concelloInput.getAttribute("aria-expanded") === "true";
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!open) renderComboOptions(concelloInput.value);
        setComboActive(comboActive + 1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (!open) renderComboOptions(concelloInput.value);
        setComboActive(comboActive - 1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (comboActive >= 0 && comboFiltered[comboActive]) {
          await selectConcello(comboFiltered[comboActive].slug);
        } else {
          const hits = filterConcellos(concelloInput.value);
          const exact = hits.find(
            (c) =>
              c.name.toLowerCase() === concelloInput.value.trim().toLowerCase()
          );
          if (exact) await selectConcello(exact.slug);
          else if (hits.length === 1) await selectConcello(hits[0].slug);
          else {
            setConcelloInput();
            closeCombo();
          }
        }
      } else if (e.key === "Escape") {
        e.preventDefault();
        setConcelloInput();
        closeCombo();
      }
    });

    concelloList.addEventListener("mousedown", (e) => {
      const opt = e.target.closest('[role="option"]');
      if (!opt) return;
      e.preventDefault();
      selectConcello(opt.dataset.slug);
    });

    concelloInput.addEventListener("blur", () => {
      window.setTimeout(() => {
        if (document.activeElement === concelloInput) return;
        if (document.activeElement === concelloClear) return;
        setConcelloInput();
        closeCombo();
      }, 120);
    });

    window.addEventListener("popstate", async () => {
      geoMode = false;
      setGeoStatus("");
      const { c, b } = parseQuery();
      if (b && index.beachConcello[b]) currentConcello = index.beachConcello[b];
      else if (c) currentConcello = c;
      else currentConcello = null;
      setConcelloInput();
      closeCombo();
      if (b) await openBeach(b, { push: false });
      else {
        currentBeach = null;
        hideTip();
        await renderLists();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      hideTip();
      if (currentBeach) closeBeach();
    });
    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".combo")) return;
      if (concelloInput.getAttribute("aria-expanded") === "true") {
        setConcelloInput();
        closeCombo();
      }
      if (!tipOpen) return;
      const tip = document.getElementById("tip");
      if (e.target.closest(".hint") || tip.contains(e.target)) return;
      hideTip();
    });

    fetch("./data/index.json", { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error(`${r.status}`);
        return r.json();
      })
      .then(async (json) => {
        index = json;
        if (!index.top) index.top = [];
        if (!index.geo) index.geo = [];
        refDay = dayOf(index.fetchedAt);
        document.getElementById("fetchedAt").textContent = index.fetchedAt || "—";
        await bootFromQuery();
      })
      .catch((err) => {
        document.getElementById("lists").innerHTML =
          `<p class="empty">No se pudo cargar data/index.json (${err.message}).</p>`;
      });
  </script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="d4689bbc-a673-4072-a3e0-5c8a7b5f16c9"></script>
