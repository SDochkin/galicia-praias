<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temperatura del agua — playas de Galicia</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #9aabbc;
      --accent: #3db8a8;
      --warn: #e0a106;
      --border: #2a3542;
      --calida: #3dba6e;
      --templada: #d4b106;
      --fria: #e05252;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      touch-action: manipulation;
    }
    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 650;
      margin: 0 0 0.35rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.35rem; }
    .combo-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .combo {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    #geo-near {
      flex: 0 0 auto;
      min-width: 2.75rem;
      min-height: 2.75rem;
      padding: 0 0.7rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #geo-near:hover { border-color: var(--accent); }
    #geo-near:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    #concello {
      width: 100%;
      padding: 0.65rem 2.85rem 0.65rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    #concello:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    #concello-clear {
      position: absolute;
      right: 0.15rem;
      top: 50%;
      transform: translateY(-50%);
      min-width: 2.75rem;
      min-height: 2.75rem;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 0.35rem;
    }
    #concello-clear:hover { color: var(--text); }
    #concello-clear[hidden] { display: none; }
    #concello-listbox {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      top: calc(100% + 0.25rem);
      margin: 0;
      padding: 0.25rem;
      list-style: none;
      max-height: min(16rem, 50vh);
      overflow: auto;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }
    #concello-listbox[hidden] { display: none; }
    #concello-listbox [role="option"] {
      padding: 0.55rem 0.7rem;
      border-radius: 0.35rem;
      cursor: pointer;
    }
    #concello-listbox [role="option"][aria-selected="true"],
    #concello-listbox [role="option"]:hover {
      background: #24303c;
      color: var(--accent);
    }
    h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 1.4rem 0 0.55rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    h3 {
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0.85rem 0 0.45rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #sort-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      margin: 0 0 0.75rem;
    }
    #sort-legend {
      font-size: 0.85rem;
      color: var(--muted);
      margin-right: 0.25rem;
    }
    #sort-bar button {
      min-height: 2.75rem;
      min-width: 2.75rem;
      padding: 0 0.7rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #sort-bar button:hover { border-color: var(--accent); }
    #sort-bar button[aria-checked="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    #sort-bar button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    ul.beach-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      align-items: stretch;
    }
    @media (min-width: 32rem) {
      ul.beach-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 48rem) {
      ul.beach-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: start;
      gap: 0.35rem 0.5rem;
      position: relative;
      min-width: 0;
      padding: 0.65rem 0.7rem;
      border-radius: 0.55rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: inherit;
      height: 100%;
    }
    .card:hover, .card.is-open { border-color: var(--accent); }
    .card.band-calida { border-color: color-mix(in srgb, var(--calida) 55%, var(--border)); }
    .card.band-templada { border-color: color-mix(in srgb, var(--templada) 45%, var(--border)); }
    .card.band-fria { border-color: color-mix(in srgb, var(--fria) 55%, var(--border)); }
    .card-hit {
      position: absolute;
      inset: 0;
      z-index: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: inherit;
      background: none;
      cursor: pointer;
    }
    .card-hit:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 2px;
    }
    .card-ident {
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }
    .card-name {
      font-weight: 550;
      min-width: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
    }
    .card-city { color: var(--muted); font-size: 0.78rem; font-weight: 400; }
    .card-metrics {
      grid-column: 1 / -1;
      grid-row: 2;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      min-width: 0;
      position: relative;
      z-index: 1;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    .card-temp-cluster {
      display: flex;
      align-items: baseline;
      position: relative;
      min-width: 0;
    }
    .card-score-cluster {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      margin-left: auto;
    }
    .card-score-label {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .card-score {
      font-weight: 650;
      font-size: 1.15rem;
    }
    .card-temp {
      font-weight: 650;
      white-space: nowrap;
    }
    .temp.band-calida { color: var(--calida); }
    .temp.band-templada { color: var(--templada); }
    .temp.band-fria { color: var(--fria); }
    .trend { margin-left: 0.25rem; font-weight: 700; }
    .hint {
      pointer-events: auto;
      min-width: 2.75rem;
      min-height: 2.75rem;
      display: grid;
      place-items: center;
      color: var(--warn);
      cursor: help;
      font-weight: 700;
      border: 0;
      background: transparent;
      padding: 0;
      font-size: 0.9rem;
      line-height: 1;
    }
    .card-temp-cluster .hint {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
    }
    .card-facts {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
    }
    .card-facts li {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.15rem 0;
    }
    .card-facts li.score-bar {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.35rem;
      padding: 0.55rem 0;
    }
    .bar-label {
      display: grid;
      grid-template-columns: 1em minmax(0, 1fr);
      column-gap: 0.4rem;
      align-items: center;
    }
    .bar-hint {
      min-width: 0;
      min-height: 0;
      justify-self: start;
      place-items: start;
      color: inherit;
      font-weight: 650;
      font-size: inherit;
    }
    .score-bar .bar {
      margin-left: calc(1em + 0.4rem);
      width: auto;
    }
    .bar-hint:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    .bar {
      width: 100%;
      min-width: 0;
      height: 0.45rem;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }
    .bar-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
    }
    .ico {
      flex: 0 0 1em;
      width: 1em;
      height: 1em;
    }
    .uv-warn { color: var(--warn); margin: 0.35rem 0 0.45rem; }
    .show-more {
      display: block;
      width: 100%;
      margin-top: 0.65rem;
      min-height: 2.75rem;
      padding: 0 0.7rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .show-more:hover { border-color: var(--accent); }
    .show-more:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    .maps {
      grid-column: 2;
      grid-row: 1;
      align-self: start;
      justify-self: end;
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      min-width: 2.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 0.55rem;
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .maps:hover { border-color: var(--accent); }
    .maps:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    #beach-dialog {
      width: min(36rem, calc(100vw - 1.5rem));
      max-height: min(80vh, 40rem);
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      overscroll-behavior: contain;
      margin: auto;
      padding: 1rem max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      background: var(--card);
      color: var(--text);
      color-scheme: dark;
    }
    #beach-dialog::-webkit-scrollbar { display: none; }
    #beach-dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
    @media (prefers-reduced-motion: reduce) {
      #beach-dialog, #beach-dialog::backdrop {
        animation: none;
        transition: none;
      }
    }
    .dialog-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .dialog-title {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
    }
    .dialog-head .maps { grid-column: auto; grid-row: auto; justify-self: auto; }
    #beach-dialog-close {
      flex: 0 0 auto;
      min-height: 2.75rem;
      min-width: 2.75rem;
      padding: 0 0.7rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }
    #beach-dialog-close:hover { border-color: var(--accent); }
    #beach-dialog-close:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    #beach-dialog h4 {
      margin: 0.75rem 0 0.25rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    #beach-dialog table { table-layout: fixed; width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    #beach-dialog th, #beach-dialog td {
      text-align: left;
      padding: 0.35rem 0.25rem;
      border-bottom: 1px solid var(--border);
    }
    #beach-dialog th:not(:first-child),
    #beach-dialog td:not(:first-child) {
      width: 4.75rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #tip {
      position: fixed;
      z-index: 40;
      max-width: min(18rem, calc(100vw - 1.5rem));
      padding: 0.55rem 0.7rem;
      border-radius: 0.45rem;
      border: 1px solid var(--warn);
      background: #2a2414;
      color: #f5e6b8;
      font-size: 0.82rem;
      line-height: 1.35;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    #tip[hidden] { display: none; }
    footer {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); }
    .empty { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Temperatura del agua</h1>
    <p class="sub">No son mediciones in situ en la orilla.</p>
    <label for="concello">Concello</label>
    <div class="combo-row">
    <div class="combo">
      <input
        id="concello"
        role="combobox"
        aria-expanded="false"
        aria-controls="concello-listbox"
        aria-autocomplete="list"
        autocomplete="off"
        placeholder="Buscar concello…"
      />
      <button type="button" id="concello-clear" hidden aria-label="Limpiar">×</button>
      <ul id="concello-listbox" role="listbox" hidden></ul>
    </div>
    <button type="button" id="geo-near" aria-label="Playas cercanas">Cerca</button>
    </div>
    <p id="geo-status" class="empty" aria-live="polite" hidden></p>
    <div id="sort-bar" role="radiogroup" aria-labelledby="sort-legend">
      <span id="sort-legend">Ordenar</span>
      <button type="button" role="radio" data-ord="agua" aria-checked="true">Agua</button>
      <button type="button" role="radio" data-ord="indice" aria-checked="false">Índice</button>
    </div>
    <div id="lists"></div>
    <dialog id="beach-dialog" aria-labelledby="beach-dialog-title">
      <div class="dialog-head">
        <h2 class="dialog-title" id="beach-dialog-title"></h2>
        <a class="maps" id="beach-dialog-maps" target="_blank" rel="noopener">Mapa</a>
        <button type="button" id="beach-dialog-close" aria-label="Cerrar">×</button>
      </div>
      <div id="beach-dialog-body"></div>
    </dialog>
    <footer>
      Datos:
      <a href="https://marine.copernicus.eu/" rel="noopener">E.U. Copernicus Marine Service</a>,
      <a href="https://www.meteogalicia.gal/" rel="noopener">MeteoGalicia</a>
      /
      <a href="https://www.meteogalicia.gal/web/modelos-numericos/meteosix" rel="noopener">MeteoSIX</a>
      y
      <a href="https://www.aemet.es/" rel="noopener">AEMET</a>.
      Licencias: <a href="DATA-LICENSE.md">por fuente</a>.
      Actualizado: <span id="fetchedAt">—</span>.
    </footer>
  </main>
  <div id="tip" hidden role="tooltip"></div>
  <script>
    const BANDS = [
      { id: "calida", title: "Cálida", cls: "band-calida" },
      { id: "templada", title: "Templada", cls: "band-templada" },
      { id: "fria", title: "Fría", cls: "band-fria" },
    ];

    const SCORE_PARTS = {
      water: "Agua",
      air: "Aire",
      wind: "Viento",
      waves: "Oleaje",
      rain: "Lluvia",
    };
    const SCORE_PART_ICONS = {
      water: "water",
      air: "air",
      wind: "wind",
      waves: "waves",
      rain: "rain",
    };
    const SCORE_PART_TIPS = {
      water:
        "Cuánto de agradable está el agua para bañarse. No mide transparencia ni higiene.",
      air: "Cuánto de agradable está el aire.",
      wind: "Menos viento es mejor.",
      waves: "Menos oleaje es mejor.",
      rain: "Menos lluvia es mejor.",
    };
    const GEO_RADIUS_KM = 30;
    const GEO_CAP = 10;
    const CONCELLO_FACE_CAP = 9;

    let index = { fetchedAt: "", concellos: [], beachConcello: {}, top: [], geo: [] };
    let refDay = "";
    let currentConcello = null;
    let currentBeach = null;
    let geoMode = false;
    let geoResults = [];
    let lastGeo = null;
    let listOrd = "agua";
    let concelloShowAll = false;
    const concelloCache = new Map();
    let tipOpen = false;
    let tipOwner = null;

    function track(name, data) {
      // Event names are an invariant: concello_select, top_view, beach_open,
      // maps_open, hint_open. These are accumulated Umami series; renaming
      // an event splits the stats. New field values inside an event are safe.
      if (typeof umami !== "undefined" && umami.track) umami.track(name, data);
    }

    function setUrl(params, { replace = false } = {}) {
      const clean = {};
      for (const [k, v] of Object.entries(params || {})) {
        if (v != null && v !== "") clean[k] = v;
      }
      if (listOrd === "indice") clean.ord = "indice";
      else delete clean.ord;
      const q = new URLSearchParams(clean).toString();
      const url = q ? `?${q}` : location.pathname;
      if (replace) history.replaceState(null, "", url);
      else history.pushState(null, "", url);
    }

    function parseQuery() {
      const p = new URLSearchParams(location.search);
      return {
        c: p.get("c"),
        b: p.get("b"),
        ord: p.get("ord") === "indice" ? "indice" : "agua",
      };
    }

    function applyListOrd(ord) {
      listOrd = ord === "indice" ? "indice" : "agua";
      const bar = document.getElementById("sort-bar");
      if (!bar) return;
      bar.querySelectorAll("[role='radio']").forEach((btn) => {
        btn.setAttribute(
          "aria-checked",
          btn.dataset.ord === listOrd ? "true" : "false"
        );
      });
    }

    function currentUrlParams() {
      const params = {};
      if (currentConcello && !geoMode) params.c = currentConcello;
      if (currentBeach && currentConcello && !geoMode) params.b = currentBeach;
      return params;
    }

    function dayOf(iso) {
      return (iso || "").slice(0, 10);
    }

    function formatDateEs(isoDay) {
      if (!isoDay) return "";
      const [y, m, d] = isoDay.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString("es-ES", { day: "numeric", month: "long" });
    }

    function formatDay(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const raw = new Intl.DateTimeFormat("es-ES", {
        weekday: "long",
        day: "numeric",
      }).format(new Date(y, m - 1, d));
      return raw.charAt(0).toLocaleUpperCase("es") + raw.slice(1);
    }

    function fmtT(t) {
      return Number(t).toLocaleString("es-ES", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1,
      });
    }

    function bandFor(t) {
      if (typeof t !== "number") return null;
      if (t >= 20) return BANDS[0];
      if (t >= 17) return BANDS[1];
      return BANDS[2];
    }

    function dayEntry(days, day) {
      return (days || []).find(
        (d) => d && d.date === day && typeof d.t === "number"
      );
    }

    function costaOf(beach) {
      if (!beach.source || beach.source === "Copernicus") return null;
      if (typeof beach.t !== "number") return null;
      return { name: beach.source, t: beach.t };
    }

    function marOf(beach) {
      const s = (beach.sources || []).find((x) => x.name === "Copernicus");
      if (!s) return null;
      const d = dayEntry(s.days, refDay);
      return d ? { name: "Copernicus", t: d.t } : null;
    }

    function disagree(beach) {
      const costa = costaOf(beach);
      const mar = marOf(beach);
      if (!costa || !mar) return false;
      return Math.abs(costa.t - mar.t) >= 3;
    }

    function disagreeText(beach) {
      const costa = costaOf(beach);
      const mar = marOf(beach);
      return (
        `Costa ${fmtT(costa.t)} °C (${costa.name}) · Mar ${fmtT(mar.t)} °C (${mar.name}): ` +
        `dos fuentes distintas; no son el mismo dato.`
      );
    }

    function lastKnown(beach) {
      let best = null;
      for (const s of beach.sources || []) {
        for (const d of [...(s.history || []), ...(s.days || [])]) {
          if (!d || typeof d.t !== "number" || !d.date) continue;
          if (refDay && d.date >= refDay) continue;
          if (!best || d.date > best.date) {
            best = { date: d.date, t: d.t, name: s.name };
          }
        }
      }
      return best;
    }

    function dashTip(beach) {
      const last = lastKnown(beach);
      if (!last) return "Sin dato de hoy.";
      return `Sin dato de hoy. Último: ${formatDateEs(last.date)} — ${last.name} ${fmtT(last.t)} °C`;
    }

    function trendGlyph(trend) {
      if (trend === "up") return "↑";
      if (trend === "down") return "↓";
      if (trend === "flat") return "→";
      return "";
    }

    function trendLabel(trend) {
      if (trend === "up") return "subiendo";
      if (trend === "down") return "bajando";
      if (trend === "flat") return "estable";
      return "";
    }

    function concelloName(slug) {
      if (!slug) return "";
      const hit = index.concellos.find((c) => c.slug === slug);
      return hit ? hit.name : slug;
    }

    let comboActive = -1;
    let comboFiltered = [];

    function syncClearButton() {
      const input = document.getElementById("concello");
      const btn = document.getElementById("concello-clear");
      btn.hidden = !input.value.trim();
    }

    function setConcelloInput() {
      const input = document.getElementById("concello");
      input.value = currentConcello ? concelloName(currentConcello) : "";
      syncClearButton();
    }

    function sortedConcellos() {
      return [...index.concellos].sort((a, b) =>
        a.name.localeCompare(b.name, "es")
      );
    }

    function filterConcellos(raw) {
      const q = (raw || "").trim().toLowerCase();
      const items = sortedConcellos();
      if (!q) return items;
      return items.filter((c) => c.name.toLowerCase().includes(q));
    }

    function closeCombo() {
      const input = document.getElementById("concello");
      const list = document.getElementById("concello-listbox");
      list.hidden = true;
      input.setAttribute("aria-expanded", "false");
      input.removeAttribute("aria-activedescendant");
      comboActive = -1;
    }

    function openCombo() {
      const input = document.getElementById("concello");
      const list = document.getElementById("concello-listbox");
      list.hidden = false;
      input.setAttribute("aria-expanded", "true");
    }

    function renderComboOptions(query) {
      const list = document.getElementById("concello-listbox");
      comboFiltered = filterConcellos(query);
      if (!comboFiltered.length) {
        list.innerHTML =
          '<li role="presentation" class="empty" style="padding:0.55rem 0.7rem">Sin resultados</li>';
        comboActive = -1;
        openCombo();
        return;
      }
      list.innerHTML = comboFiltered
        .map(
          (c, i) =>
            `<li role="option" id="concello-opt-${i}" data-slug="${c.slug}">${c.name}</li>`
        )
        .join("");
      comboActive = -1;
      openCombo();
    }

    function setComboActive(i) {
      const list = document.getElementById("concello-listbox");
      const input = document.getElementById("concello");
      const opts = [...list.querySelectorAll('[role="option"]')];
      if (!opts.length) return;
      comboActive = ((i % opts.length) + opts.length) % opts.length;
      opts.forEach((el, idx) => {
        el.setAttribute("aria-selected", idx === comboActive ? "true" : "false");
      });
      const active = opts[comboActive];
      input.setAttribute("aria-activedescendant", active.id);
      active.scrollIntoView({ block: "nearest" });
    }

    function ensureConcelloReady() {
      if (currentConcello === null) {
        setConcelloInput();
        return;
      }
      const items = sortedConcellos();
      if (!items.some((c) => c.slug === currentConcello) && items.length) {
        currentConcello = items[0].slug;
      }
      setConcelloInput();
    }

    async function selectConcello(slug) {
      geoMode = false;
      setGeoStatus("");
      concelloShowAll = false;
      if (!slug || slug === currentConcello) {
        setConcelloInput();
        closeCombo();
        await renderLists();
        return;
      }
      currentConcello = slug;
      currentBeach = null;
      geoMode = false;
      hideTip();
      setConcelloInput();
      closeCombo();
      setUrl({ c: currentConcello });
      track("concello_select", { slug: currentConcello });
      await renderLists();
    }

    async function clearConcello() {
      geoMode = false;
      setGeoStatus("");
      currentConcello = null;
      currentBeach = null;
      geoMode = false;
      concelloShowAll = false;
      hideTip();
      setConcelloInput();
      closeCombo();
      setUrl({});
      track("top_view");
      await renderLists();
    }

    async function loadConcello(slug) {
      if (concelloCache.has(slug)) return concelloCache.get(slug);
      const r = await fetch(`./data/${slug}.json`, { cache: "no-store" });
      if (!r.ok) throw new Error(`${r.status}`);
      const json = await r.json();
      concelloCache.set(slug, json);
      return json;
    }

    function hideTip() {
      tipOpen = false;
      tipOwner = null;
      const tip = document.getElementById("tip");
      tip.hidden = true;
      tip.textContent = "";
      if (tip.parentElement !== document.body) {
        document.body.appendChild(tip);
      }
      document.querySelectorAll(".hint[aria-describedby='tip']").forEach((el) => {
        el.removeAttribute("aria-describedby");
      });
    }

    function showTip(btn, text, clientX, clientY) {
      const tip = document.getElementById("tip");
      const dlg = document.getElementById("beach-dialog");
      const host = dlg && dlg.open && dlg.contains(btn) ? dlg : document.body;
      if (tip.parentElement !== host) host.appendChild(tip);
      tip.textContent = text;
      tip.hidden = false;
      tipOpen = true;
      tipOwner = btn;
      document.querySelectorAll(".hint[aria-describedby='tip']").forEach((el) => {
        el.removeAttribute("aria-describedby");
      });
      btn.setAttribute("aria-describedby", "tip");
      const pad = 12;
      let x = clientX + 10;
      let y = clientY + 10;
      tip.style.left = "0px";
      tip.style.top = "0px";
      const rect = tip.getBoundingClientRect();
      if (x + rect.width > window.innerWidth - pad) {
        x = Math.max(pad, clientX - rect.width - 10);
      }
      if (y + rect.height > window.innerHeight - pad) {
        y = Math.max(pad, clientY - rect.height - 10);
      }
      tip.style.left = `${x}px`;
      tip.style.top = `${y}px`;
    }

    function canHover() {
      return window.matchMedia("(hover: hover)").matches;
    }

    function bindHint(btn) {
      const text = btn.dataset.tip || "";

      btn.addEventListener("mouseenter", (e) => {
        if (!canHover()) return;
        showTip(btn, text, e.clientX, e.clientY);
      });
      btn.addEventListener("mousemove", (e) => {
        if (!canHover() || !tipOpen) return;
        showTip(btn, text, e.clientX, e.clientY);
      });
      btn.addEventListener("mouseleave", () => {
        if (!canHover()) return;
        hideTip();
      });
      btn.addEventListener("focus", () => {
        const r = btn.getBoundingClientRect();
        showTip(btn, text, r.left + r.width / 2, r.bottom);
      });
      btn.addEventListener("blur", () => hideTip());
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (tipOpen && tipOwner === btn) {
          hideTip();
          return;
        }
        track("hint_open", { kind: btn.dataset.kind || "disagree" });
        const r = btn.getBoundingClientRect();
        showTip(btn, text, r.left + r.width / 2, r.bottom);
      });
    }

    function setGeoStatus(msg) {
      const el = document.getElementById("geo-status");
      if (!el) return;
      if (!msg) {
        el.hidden = true;
        el.textContent = "";
        return;
      }
      el.hidden = false;
      el.textContent = msg;
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const rad = (d) => (d * Math.PI) / 180;
      const dLat = rad(lat2 - lat1);
      const dLon = rad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function nearbyBeaches(lat, lon) {
      const hit = [];
      for (const b of index.geo || []) {
        if (typeof b.lat !== "number" || typeof b.lon !== "number") continue;
        const km = haversineKm(lat, lon, b.lat, b.lon);
        if (km > GEO_RADIUS_KM) continue;
        if (listOrd === "agua" && typeof b.t !== "number") continue;
        hit.push({ ...b, km });
      }
      return sortBeaches(hit).slice(0, GEO_CAP);
    }

    function beachConcelloLabel(beach) {
      return (
        beach.concello ||
        concelloName(index.beachConcello[beach.slug] || beach.concelloSlug)
      );
    }

    function seriesByDay(src) {
      const m = new Map();
      if (!src) return m;
      for (const d of [...(src.history || []), ...(src.days || [])]) {
        if (d && d.date && typeof d.t === "number") m.set(d.date, d.t);
      }
      return m;
    }

    function uvLabel(uv) {
      if (typeof uv !== "number") return "";
      if (uv <= 2) return "bajo";
      if (uv <= 5) return "moderado";
      if (uv <= 7) return "alto";
      if (uv <= 10) return "muy alto";
      return "extremo";
    }

    function accordionTable(title, dates, costaDays, marDays, uvDays, costaName) {
      if (!dates.length) return "";
      const costaTitle = costaName ? `Según ${costaName}` : "";
      const heads = [
        "<th>Día</th>",
        `<th title="${escapeAttr(costaTitle)}">Costa</th>`,
        `<th title="${escapeAttr("Según Copernicus")}">Mar</th>`,
        `<th title="${escapeAttr("Índice UV máximo del día (OMS)")}">UV</th>`,
      ];
      const rows = dates.map((d) => {
        const tC = costaDays.get(d);
        const tM = marDays.get(d);
        const uv = uvDays.get(d);
        return (
          `<tr><td>${formatDay(d)}</td>` +
          `<td>${tC == null ? "—" : `${fmtT(tC)} °C`}</td>` +
          `<td>${tM == null ? "—" : `${fmtT(tM)} °C`}</td>` +
          `<td>${typeof uv === "number" ? `${uv} ${uvLabel(uv)}` : "—"}</td></tr>`
        );
      });
      return (
        `<h4>${title}</h4><table><thead><tr>${heads.join("")}</tr></thead>` +
        `<tbody>${rows.join("")}</tbody></table>`
      );
    }

    function madridClock(scoreDay, utcHour) {
      if (typeof utcHour !== "number" || !scoreDay) return "";
      const [y, m, d] = scoreDay.split("-").map(Number);
      for (const delta of [0, -1, 1]) {
        const dt = new Date(Date.UTC(y, m - 1, d + delta, utcHour));
        const md = dt.toLocaleString("sv-SE", { timeZone: "Europe/Madrid" }).slice(0, 10);
        if (md === scoreDay) {
          return dt.toLocaleString("es-ES", {
            timeZone: "Europe/Madrid",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          });
        }
      }
      return `${String(utcHour).padStart(2, "0")}:00`;
    }

    function scoreColor(score) {
      const s = Math.max(0, Math.min(100, Number(score))) / 100;
      const fria = [224, 82, 82];
      const templada = [232, 196, 48];
      const calida = [61, 186, 110];
      const lerp = (a, b, t) => a.map((c, i) => Math.round(c + (b[i] - c) * t));
      const rgb = s < 0.5 ? lerp(fria, templada, s / 0.5) : lerp(templada, calida, (s - 0.5) / 0.5);
      return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
    }

    function iconSvg(name) {
      const paths = {
        indice:
          '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        clock:
          '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',
        water:
          '<path d="M12 3s7 8 7 12a7 7 0 1 1-14 0c0-4 7-12 7-12z"/>',
        air: '<path d="M14 4v16M10 8h4M10 16h4"/><path d="M14 8a2.5 2.5 0 1 1 0 5"/>',
        wind: '<path d="M3 10h11a3 3 0 1 0-3-3M3 14h8a2.5 2.5 0 1 1-2.5 2.5"/>',
        waves: '<path d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/>',
        rain: '<path d="M8 6a5 5 0 0 1 9 3h1a3.5 3.5 0 1 1 0 7H7a4 4 0 0 1-1-7.9"/><path d="M8 18v2M12 17v3M16 18v2"/>',
        sea: '<path d="M3 13c2 2 4 2 6 0s4-2 6 0 4 2 6 0M3 18c2 2 4 2 6 0s4-2 6 0 4 2 6 0"/>',
      };
      const d = paths[name];
      if (!d) return "";
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    }

    function partQual(n) {
      if (n >= 67) return "Bien";
      if (n >= 34) return "Regular";
      return "Mal";
    }

    function scoreBar(icon, key, value) {
      const label = SCORE_PARTS[key];
      const q = partQual(value);
      const tip = SCORE_PART_TIPS[key] || "";
      return `<li class="score-bar"><div class="bar-label">${iconSvg(icon)}<button type="button" class="hint bar-hint" data-kind="part-${key}" data-tip="${escapeAttr(
        tip
      )}" aria-label="${escapeAttr(label)}">${label}</button></div><span class="bar" role="img" aria-label="${escapeAttr(
        `${label}: ${q}`
      )}"><span class="bar-fill" style="width:${Math.max(
        0,
        Math.min(100, value)
      )}%;background:${scoreColor(value)}"></span></span></li>`;
    }

    function uvMap(beach) {
      const mgSrc = (beach.sources || []).find((s) => s.name === "MeteoGalicia");
      const uvDays = new Map();
      for (const d of (mgSrc && mgSrc.days) || []) {
        if (d && d.date && typeof d.uv === "number") uvDays.set(d.date, d.uv);
      }
      return uvDays;
    }

    function cardBackHtml(beach) {
      const costaSrc =
        beach.source && beach.source !== "Copernicus"
          ? (beach.sources || []).find((s) => s.name === beach.source)
          : null;
      const marSrc = (beach.sources || []).find((s) => s.name === "Copernicus");
      const costaDays = seriesByDay(costaSrc);
      const marDays = seriesByDay(marSrc);
      const uvDays = uvMap(beach);
      const allDates = [
        ...new Set([...costaDays.keys(), ...marDays.keys(), ...uvDays.keys()]),
      ].sort();
      const histDates = allDates.filter((d) => d < refDay);
      const futDates = allDates.filter((d) => d >= refDay);
      const facts = [];
      if (typeof beach.score === "number") {
        const parts = beach.scoreParts || {};
        for (const k of Object.keys(SCORE_PARTS)) {
          if (typeof parts[k] === "number") {
            facts.push(scoreBar(SCORE_PART_ICONS[k], k, parts[k]));
          }
        }
        const best = madridClock(beach.scoreDay, beach.bestHour);
        const win = beach.scoreWindow
          ? `${madridClock(beach.scoreDay, beach.scoreWindow.from)}–${madridClock(beach.scoreDay, beach.scoreWindow.to)}`
          : "";
        facts.push(factItem("clock", "Mejor hora", best || "—"));
        facts.push(factItem("clock", "Ventana", win || "—"));
      }
      const mar = marOf(beach);
      if (mar) facts.push(factItem("sea", "Mar", `${fmtT(mar.t)} °C`));
      const bits = [];
      if (facts.length) bits.push(`<ul class="card-facts">${facts.join("")}</ul>`);
      const todayUv = uvDays.get(refDay);
      if (typeof todayUv === "number" && todayUv >= 8) {
        bits.push(`<p class="uv-warn">UV muy alto: usa protección solar.</p>`);
      }
      const tables = [
        accordionTable("Histórico", histDates, costaDays, marDays, uvDays, costaSrc ? beach.source : ""),
        accordionTable("Pronóstico", futDates, costaDays, marDays, uvDays, costaSrc ? beach.source : ""),
      ].join("");
      if (tables) bits.push(tables);
      return bits.join("");
    }

    function factItem(icon, label, value) {
      return `<li>${iconSvg(icon)}<span>${label} ${value}</span></li>`;
    }

    function escapeAttr(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function todaySourceCount(beach) {
      return (beach.sources || []).filter((s) => dayEntry(s.days, refDay)).length;
    }

    function withScore(beach) {
      if (typeof beach.score === "number") return beach;
      const g = (index.geo || []).find((x) => x.slug === beach.slug);
      if (g && typeof g.score === "number") return { ...beach, score: g.score };
      return beach;
    }

    function mapsQuery(beach) {
      const concello = beachConcelloLabel(beach);
      return encodeURIComponent(`${beach.name}, ${concello}, Galicia`);
    }

    function cardHtml(beach, { showConcello = false } = {}) {
      beach = withScore(beach);
      const hasT = typeof beach.t === "number";
      const hasScore = typeof beach.score === "number";
      const band = hasT ? bandFor(beach.t) : null;
      const bandCls = band ? band.cls : "";
      let tipBtn = "";
      if (hasT && disagree(beach)) {
        tipBtn = `<button type="button" class="hint" data-kind="disagree" data-tip="${escapeAttr(
          disagreeText(beach)
        )}" aria-label="Fuentes discrepan">?</button>`;
      } else if (!hasT && (beach.sources || []).length) {
        tipBtn = `<button type="button" class="hint" data-kind="nodata" data-tip="${escapeAttr(
          dashTip(beach)
        )}" aria-label="Sin dato de hoy">?</button>`;
      } else if (todaySourceCount(beach) === 1) {
        tipBtn = `<button type="button" class="hint" data-kind="single" data-tip="${escapeAttr(
          "Solo una fuente tiene dato de hoy: no hay con qué comparar."
        )}" aria-label="Una sola fuente">?</button>`;
      }
      const trendName = hasT ? trendLabel(beach.trend) : "";
      const g = hasT ? trendGlyph(beach.trend) : "";
      const trend = g
        ? `<span class="trend" aria-label="${escapeAttr(trendName)}">${g}</span>`
        : "";
      const open = currentBeach === beach.slug;
      const tempText = hasT ? `${fmtT(beach.t)} °C` : "—";
      const concello = beachConcelloLabel(beach);
      const q = mapsQuery(beach);
      const city =
        showConcello && concello
          ? `<div class="card-city">${concello}</div>`
          : "";
      const nameId = `name-${beach.slug}`;
      const scoreHtml = hasScore
        ? `<span class="card-score-label">Índice</span><span class="card-score" style="color:${scoreColor(
            beach.score
          )}" aria-label="Índice ${beach.score}">${beach.score}</span>`
        : `<span class="card-score-label">Índice</span><span class="card-score" aria-label="Índice no disponible">—</span>`;
      return `<li>
        <article class="card ${bandCls}${open ? " is-open" : ""}" data-slug="${beach.slug}">
          <button type="button" class="card-hit" data-slug="${beach.slug}" aria-labelledby="${nameId}" aria-haspopup="dialog" aria-expanded="${
            open ? "true" : "false"
          }"></button>
          <div class="card-ident">
            <div class="card-name" id="${nameId}">${beach.name}</div>
            ${city}
          </div>
          <a class="maps" target="_blank" rel="noopener" data-slug="${beach.slug}" href="https://www.google.com/maps/search/?api=1&amp;query=${q}">Mapa</a>
          <div class="card-metrics">
            <div class="card-temp-cluster">
              <span class="card-temp temp ${bandCls}">${tempText}${trend}</span>
              ${tipBtn}
            </div>
            <div class="card-score-cluster">${scoreHtml}</div>
          </div>
        </article>
      </li>`;
    }

    function sortBeaches(items) {
      const key = listOrd === "indice" ? "score" : "t";
      return [...items].map(withScore).sort((a, b) => {
        const av = a[key];
        const bv = b[key];
        const aOk = typeof av === "number";
        const bOk = typeof bv === "number";
        if (aOk && bOk && bv !== av) return bv - av;
        if (aOk !== bOk) return aOk ? -1 : 1;
        return a.name.localeCompare(b.name, "es");
      });
    }

    function renderBanded(beaches, { showConcello = false, cap = null } = {}) {
      const withT = beaches.filter((b) => typeof b.t === "number");
      const withoutT = beaches.filter(
        (b) =>
          typeof b.t !== "number" &&
          ((b.sources || []).length || typeof b.score === "number")
      );
      const sorted = sortBeaches(withT);
      let shown = sorted;
      let hidden = 0;
      if (cap && sorted.length > cap && !concelloShowAll) {
        const openIdx = currentBeach
          ? sorted.findIndex((b) => b.slug === currentBeach)
          : -1;
        if (openIdx < cap) {
          shown = sorted.slice(0, cap);
          hidden = sorted.length - cap;
        }
      }
      const parts = [];
      if (shown.length) {
        parts.push(
          `<ul class="beach-list">${shown
            .map((b) => cardHtml(b, { showConcello }))
            .join("")}</ul>`
        );
      }
      if (hidden) {
        parts.push(
          `<button type="button" class="show-more" id="show-more">Mostrar las demás (${hidden})</button>`
        );
      }
      if (withoutT.length) {
        const items = [...withoutT].sort((a, b) =>
          a.name.localeCompare(b.name, "es")
        );
        parts.push(
          `<section><h3>Sin dato de hoy</h3><ul class="beach-list">${items
            .map((b) => cardHtml(b, { showConcello }))
            .join("")}</ul></section>`
        );
      }
      return parts;
    }

    function bindList(root) {
      root.querySelectorAll("button.card-hit").forEach((btn) => {
        btn.addEventListener("click", () => {
          const slug = btn.dataset.slug;
          if (!slug) return;
          if (currentBeach === slug) closeBeach();
          else openBeach(slug, { from: geoMode ? "geo" : undefined });
        });
      });
      root.querySelectorAll("button.hint").forEach(bindHint);
      root.querySelectorAll("a.maps").forEach((a) => {
        a.addEventListener("click", () => {
          track("maps_open", { slug: a.dataset.slug });
        });
      });
      const more = root.querySelector("#show-more");
      if (more) {
        more.addEventListener("click", () => {
          concelloShowAll = true;
          renderLists();
        });
      }
    }

    function findOpenBeach() {
      if (!currentBeach) return null;
      if (geoMode) {
        return geoResults.find((b) => b.slug === currentBeach) || null;
      }
      if (currentConcello) {
        const payload = concelloCache.get(currentConcello);
        return (
          (payload && payload.beaches || []).find((b) => b.slug === currentBeach) ||
          null
        );
      }
      return (index.top || []).find((b) => b.slug === currentBeach) || null;
    }

    function fillBeachDialog(beach) {
      const title = document.getElementById("beach-dialog-title");
      const maps = document.getElementById("beach-dialog-maps");
      const body = document.getElementById("beach-dialog-body");
      title.textContent = beach.name;
      maps.href = `https://www.google.com/maps/search/?api=1&query=${mapsQuery(beach)}`;
      maps.dataset.slug = beach.slug;
      body.innerHTML = cardBackHtml(beach);
      body.querySelectorAll("button.hint").forEach(bindHint);
    }

    function showBeachDialog(beach) {
      fillBeachDialog(beach);
      const dlg = document.getElementById("beach-dialog");
      if (!dlg.open) dlg.showModal();
    }

    async function enrichTopBeach(beach) {
      if ((beach.sources || []).some((s) => s.history)) return beach;
      const cslug = index.beachConcello[beach.slug] || beach.concelloSlug;
      if (!cslug) return beach;
      try {
        const payload = await loadConcello(cslug);
        const full = (payload.beaches || []).find((b) => b.slug === beach.slug);
        if (full) {
          return {
            ...beach,
            ...full,
            concello: beach.concello || beachConcelloLabel(beach),
            concelloSlug: cslug,
          };
        }
      } catch (_) {
        /* keep slim */
      }
      return beach;
    }

    async function renderLists() {
      const root = document.getElementById("lists");
      const dlg = document.getElementById("beach-dialog");
      if (!currentBeach && dlg.open) dlg.close();

      if (geoMode) {
        if (currentBeach) {
          const idx = geoResults.findIndex((b) => b.slug === currentBeach);
          if (idx >= 0) {
            geoResults[idx] = await enrichTopBeach(geoResults[idx]);
          }
        }
        const items = sortBeaches(geoResults)
          .map((b) => cardHtml(b, { showConcello: true }))
          .join("");
        root.innerHTML = `<h2>Playas cercanas</h2><ul class="beach-list">${items}</ul>`;
        bindList(root);
        return;
      }

      if (currentConcello === null) {
        if (currentBeach) {
          const idx = (index.top || []).findIndex((b) => b.slug === currentBeach);
          if (idx >= 0) {
            index.top[idx] = await enrichTopBeach(index.top[idx]);
          }
        }
        const parts = renderBanded(index.top || [], { showConcello: true });
        const title =
          listOrd === "indice" ? "Mejor índice hoy" : "Las más cálidas";
        root.innerHTML = parts.length
          ? `<h2>${title}</h2>${parts.join("")}`
          : '<p class="empty">Sin destacadas.</p>';
        bindList(root);
        return;
      }

      if (!concelloCache.has(currentConcello)) {
        root.innerHTML = '<p class="empty">Cargando…</p>';
      }

      let payload;
      try {
        payload = await loadConcello(currentConcello);
      } catch (err) {
        root.innerHTML = `<p class="empty">No se pudo cargar ${currentConcello} (${err.message}).</p>`;
        return;
      }
      const beaches = payload.beaches || [];
      const parts = renderBanded(beaches, {
        showConcello: false,
        cap: CONCELLO_FACE_CAP,
      });
      root.innerHTML =
        parts.join("") || '<p class="empty">Sin datos para este concello.</p>';
      bindList(root);
    }

    async function openBeach(slug, { push = true, from } = {}) {
      currentBeach = slug;
      if (push) {
        const src = from || (geoMode ? "geo" : currentConcello ? "concello" : "top");
        track("beach_open", { slug, from: src });
        if (currentConcello && !geoMode) setUrl({ c: currentConcello, b: slug });
      }
      await renderLists();
      const beach = findOpenBeach();
      if (beach) showBeachDialog(beach);
    }

    function closeBeach({ push = true } = {}) {
      const slug = currentBeach;
      currentBeach = null;
      hideTip();
      if (push && !geoMode) {
        if (currentConcello === null) setUrl({});
        else setUrl({ c: currentConcello });
      }
      const dlg = document.getElementById("beach-dialog");
      if (dlg.open) dlg.close();
      renderLists();
      if (slug) {
        const hit = document.querySelector(
          `.card[data-slug="${CSS.escape(slug)}"] .card-hit`
        );
        if (hit) hit.focus();
      }
    }

    async function bootFromQuery() {
      const { c, b, ord } = parseQuery();
      applyListOrd(ord);
      if (b && index.beachConcello[b]) {
        currentConcello = index.beachConcello[b];
      } else if (c) {
        currentConcello = c;
      } else {
        currentConcello = null;
      }
      ensureConcelloReady();
      if (!c && !b) track("top_view");
      if (b) await openBeach(b, { push: false });
      else await renderLists();
    }

    const concelloInput = document.getElementById("concello");
    const concelloList = document.getElementById("concello-listbox");
    const concelloClear = document.getElementById("concello-clear");

    concelloClear.addEventListener("click", (e) => {
      e.preventDefault();
      clearConcello();
    });

    const beachDialog = document.getElementById("beach-dialog");
    document.getElementById("beach-dialog-close").addEventListener("click", () => {
      closeBeach();
    });
    document.getElementById("beach-dialog-maps").addEventListener("click", () => {
      track("maps_open", { slug: document.getElementById("beach-dialog-maps").dataset.slug });
    });
    beachDialog.addEventListener("click", (e) => {
      if (e.target === beachDialog) closeBeach();
    });
    beachDialog.addEventListener("close", () => {
      if (currentBeach) closeBeach();
    });

    function changeListOrd(ord) {
      applyListOrd(ord);
      if (geoMode && lastGeo) {
        geoResults = nearbyBeaches(lastGeo.lat, lastGeo.lon);
      }
      setUrl(currentUrlParams());
      renderLists();
    }

    document.getElementById("sort-bar").addEventListener("click", (e) => {
      const btn = e.target.closest("[role='radio']");
      if (!btn || !btn.dataset.ord) return;
      changeListOrd(btn.dataset.ord);
    });
    document.getElementById("sort-bar").addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft" && e.key !== "ArrowDown" && e.key !== "ArrowUp") {
        return;
      }
      const radios = [
        ...document.getElementById("sort-bar").querySelectorAll("[role='radio']"),
      ];
      if (!radios.length) return;
      e.preventDefault();
      const i = radios.findIndex((b) => b.dataset.ord === listOrd);
      const next = radios[(i + (e.key === "ArrowLeft" || e.key === "ArrowUp" ? radios.length - 1 : 1)) % radios.length];
      next.focus();
      changeListOrd(next.dataset.ord);
    });

    document.getElementById("geo-near").addEventListener("click", () => {
      if (!navigator.geolocation) {
        geoMode = false;
        geoResults = [];
        setGeoStatus("No se pudo obtener tu ubicación.");
        return;
      }
      setGeoStatus("Obteniendo ubicación…");
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const near = nearbyBeaches(pos.coords.latitude, pos.coords.longitude);
          if (!near.length) {
            geoMode = false;
            geoResults = [];
            lastGeo = null;
            setGeoStatus("No hay playas a menos de 30 km.");
            await renderLists();
            return;
          }
          lastGeo = {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
          };
          currentConcello = null;
          setConcelloInput();
          setGeoStatus("");
          geoMode = true;
          geoResults = near;
          currentBeach = null;
          await renderLists();
        },
        async () => {
          geoMode = false;
          geoResults = [];
          lastGeo = null;
          setGeoStatus("No se pudo obtener tu ubicación.");
          await renderLists();
        }
      );
    });

    concelloInput.addEventListener("focus", () => {
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("click", () => {
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("input", () => {
      syncClearButton();
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("keydown", async (e) => {
      const open = concelloInput.getAttribute("aria-expanded") === "true";
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!open) renderComboOptions(concelloInput.value);
        setComboActive(comboActive + 1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (!open) renderComboOptions(concelloInput.value);
        setComboActive(comboActive - 1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (comboActive >= 0 && comboFiltered[comboActive]) {
          await selectConcello(comboFiltered[comboActive].slug);
        } else {
          const hits = filterConcellos(concelloInput.value);
          const exact = hits.find(
            (c) =>
              c.name.toLowerCase() === concelloInput.value.trim().toLowerCase()
          );
          if (exact) await selectConcello(exact.slug);
          else if (hits.length === 1) await selectConcello(hits[0].slug);
          else {
            setConcelloInput();
            closeCombo();
          }
        }
      } else if (e.key === "Escape") {
        e.preventDefault();
        setConcelloInput();
        closeCombo();
      }
    });

    concelloList.addEventListener("mousedown", (e) => {
      const opt = e.target.closest('[role="option"]');
      if (!opt) return;
      e.preventDefault();
      selectConcello(opt.dataset.slug);
    });

    concelloInput.addEventListener("blur", () => {
      window.setTimeout(() => {
        if (document.activeElement === concelloInput) return;
        if (document.activeElement === concelloClear) return;
        setConcelloInput();
        closeCombo();
      }, 120);
    });

    window.addEventListener("popstate", async () => {
      geoMode = false;
      setGeoStatus("");
      const { c, b, ord } = parseQuery();
      applyListOrd(ord);
      if (b && index.beachConcello[b]) currentConcello = index.beachConcello[b];
      else if (c) currentConcello = c;
      else currentConcello = null;
      setConcelloInput();
      closeCombo();
      if (b) await openBeach(b, { push: false });
      else {
        currentBeach = null;
        hideTip();
        await renderLists();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      hideTip();
      if (currentBeach) closeBeach();
    });
    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".combo")) return;
      if (concelloInput.getAttribute("aria-expanded") === "true") {
        setConcelloInput();
        closeCombo();
      }
      if (!tipOpen) return;
      const tip = document.getElementById("tip");
      if (e.target.closest(".hint") || tip.contains(e.target)) return;
      hideTip();
    });

    fetch("./data/index.json", { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error(`${r.status}`);
        return r.json();
      })
      .then(async (json) => {
        index = json;
        if (!index.top) index.top = [];
        if (!index.geo) index.geo = [];
        refDay = dayOf(index.fetchedAt);
        document.getElementById("fetchedAt").textContent = index.fetchedAt || "—";
        await bootFromQuery();
      })
      .catch((err) => {
        document.getElementById("lists").innerHTML =
          `<p class="empty">No se pudo cargar data/index.json (${err.message}).</p>`;
      });
  </script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="d4689bbc-a673-4072-a3e0-5c8a7b5f16c9"></script>
