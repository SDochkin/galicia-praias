<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temperatura del agua — playas de Galicia</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #9aabbc;
      --accent: #3db8a8;
      --warn: #e0a106;
      --border: #2a3542;
      --calida: #3dba6e;
      --templada: #d4b106;
      --fria: #e05252;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 650;
      margin: 0 0 0.35rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .banner {
      background: #2a2414;
      border: 1px solid var(--warn);
      color: #f5e6b8;
      padding: 0.65rem 0.8rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.35rem; }
    .combo {
      position: relative;
      margin-bottom: 1.25rem;
    }
    #concello {
      width: 100%;
      padding: 0.65rem 2.85rem 0.65rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    #concello:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    #concello-clear {
      position: absolute;
      right: 0.15rem;
      top: 50%;
      transform: translateY(-50%);
      min-width: 2.75rem;
      min-height: 2.75rem;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 0.35rem;
    }
    #concello-clear:hover { color: var(--text); }
    #concello-clear[hidden] { display: none; }
    #concello-listbox {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      top: calc(100% + 0.25rem);
      margin: 0;
      padding: 0.25rem;
      list-style: none;
      max-height: min(16rem, 50vh);
      overflow: auto;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }
    #concello-listbox[hidden] { display: none; }
    #concello-listbox [role="option"] {
      padding: 0.55rem 0.7rem;
      border-radius: 0.35rem;
      cursor: pointer;
    }
    #concello-listbox [role="option"][aria-selected="true"],
    #concello-listbox [role="option"]:hover {
      background: #24303c;
      color: var(--accent);
    }
    h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 1.4rem 0 0.55rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    ul.beach-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.5rem;
      align-items: baseline;
      width: 100%;
      padding: 0.75rem 0.85rem;
      border-radius: 0.55rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: inherit;
    }
    .row:hover, .row.active { border-color: var(--accent); }
    .row.band-calida { border-color: color-mix(in srgb, var(--calida) 55%, var(--border)); }
    .row.band-templada { border-color: color-mix(in srgb, var(--templada) 45%, var(--border)); }
    .row.band-fria { border-color: color-mix(in srgb, var(--fria) 55%, var(--border)); }
    .row-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0 0.75rem;
      min-width: 0;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .row-main .name {
      grid-column: 1;
      font-weight: 550;
      min-width: 0;
    }
    .row-main .temp {
      grid-column: 2;
      grid-row: 1;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      white-space: nowrap;
    }
    .row-main .src {
      grid-column: 1 / -1;
      min-width: 0;
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 0.15rem;
    }
    .temp.band-calida { color: var(--calida); }
    .temp.band-templada { color: var(--templada); }
    .temp.band-fria { color: var(--fria); }
    .trend { margin-left: 0.25rem; font-weight: 700; }
    .hint {
      min-width: 2.75rem;
      min-height: 2.75rem;
      display: grid;
      place-items: center;
      align-self: center;
      color: var(--warn);
      cursor: help;
      font-weight: 700;
      border: 0;
      background: transparent;
      padding: 0;
      font-size: 0.9rem;
      line-height: 1;
    }
    .accordion {
      margin: -0.15rem 0 0.35rem;
      padding: 0.85rem 0.9rem;
      border-radius: 0.55rem;
      border: 1px solid var(--border);
      background: #141b23;
    }
    .accordion h3 { margin: 0 0 0.35rem; font-size: 1.05rem; }
    .accordion h4 {
      margin: 0.75rem 0 0.25rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .accordion .src { color: var(--muted); font-size: 0.78rem; margin: 0 0 0.55rem; }
    .accordion table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .accordion th, .accordion td {
      text-align: left;
      padding: 0.35rem 0.25rem;
      border-bottom: 1px solid var(--border);
    }
    .maps {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      margin-top: 0.35rem;
      padding: 0.45rem 0.85rem;
      border-radius: 0.55rem;
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .maps:hover { border-color: var(--accent); }
    #tip {
      position: fixed;
      z-index: 40;
      max-width: min(18rem, calc(100vw - 1.5rem));
      padding: 0.55rem 0.7rem;
      border-radius: 0.45rem;
      border: 1px solid var(--warn);
      background: #2a2414;
      color: #f5e6b8;
      font-size: 0.82rem;
      line-height: 1.35;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    #tip[hidden] { display: none; }
    footer {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); }
    .empty { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Temperatura del agua</h1>
    <p class="sub">Temperatura del agua en playas de Galicia. No son mediciones in situ en la orilla.</p>
    <div id="stale" class="banner" hidden></div>
    <label for="concello">Concello</label>
    <div class="combo">
      <input
        id="concello"
        role="combobox"
        aria-expanded="false"
        aria-controls="concello-listbox"
        aria-autocomplete="list"
        autocomplete="off"
        placeholder="Buscar concello…"
      />
      <button type="button" id="concello-clear" hidden aria-label="Limpiar">×</button>
      <ul id="concello-listbox" role="listbox" hidden></ul>
    </div>
    <div id="lists"></div>
    <footer>
      Datos:
      <a href="https://marine.copernicus.eu/" rel="noopener">E.U. Copernicus Marine Service</a>,
      <a href="https://www.meteogalicia.gal/" rel="noopener">MeteoGalicia</a>
      (CC BY-SA 4.0) y
      <a href="https://www.aemet.es/" rel="noopener">AEMET</a>.
      Actualizado: <span id="fetchedAt">—</span>.
    </footer>
  </main>
  <div id="tip" hidden role="tooltip"></div>
  <script>
    const BANDS = [
      { id: "calida", title: "Cálida", cls: "band-calida" },
      { id: "templada", title: "Templada", cls: "band-templada" },
      { id: "fria", title: "Fría", cls: "band-fria" },
    ];

    let index = { fetchedAt: "", concellos: [], beachConcello: {}, top: [] };
    let refDay = "";
    let currentConcello = null;
    let currentBeach = null;
    const concelloCache = new Map();
    let tipOpen = false;
    let tipOwner = null;

    function trackPage() {
      if (typeof umami !== "undefined" && typeof umami.track === "function") {
        umami.track();
      }
    }

    function setUrl(params, { replace = false, track = true } = {}) {
      const clean = {};
      for (const [k, v] of Object.entries(params || {})) {
        if (v != null && v !== "") clean[k] = v;
      }
      const q = new URLSearchParams(clean).toString();
      const url = q ? `?${q}` : location.pathname;
      if (replace) history.replaceState(null, "", url);
      else history.pushState(null, "", url);
      if (track && !replace) trackPage();
    }

    function parseQuery() {
      const p = new URLSearchParams(location.search);
      return { c: p.get("c"), b: p.get("b") };
    }

    function dayOf(iso) {
      return (iso || "").slice(0, 10);
    }

    function todayLocalISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatDateEs(isoDay) {
      if (!isoDay) return "";
      const [y, m, d] = isoDay.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString("es-ES", { day: "numeric", month: "long" });
    }

    function fmtT(t) {
      return Number(t).toLocaleString("es-ES", {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1,
      });
    }

    function bandFor(t) {
      if (typeof t !== "number") return null;
      if (t >= 20) return BANDS[0];
      if (t >= 17) return BANDS[1];
      return BANDS[2];
    }

    function dayEntry(days, day) {
      return (days || []).find(
        (d) => d && d.date === day && typeof d.t === "number"
      );
    }

    function sourceTemps(beach) {
      return (beach.sources || [])
        .map((s) => {
          const d = dayEntry(s.days, refDay);
          return d ? { name: s.name, t: d.t } : null;
        })
        .filter(Boolean);
    }

    function sourceLine(beach, { withConcello = false } = {}) {
      const bits = sourceTemps(beach).map((x) => `${x.name} ${fmtT(x.t)} °C`);
      if (withConcello) {
        const c =
          beach.concello ||
          concelloName(index.beachConcello[beach.slug] || beach.concelloSlug);
        if (c) bits.unshift(c);
      }
      return bits.join(" · ");
    }

    function disagree(beach) {
      const ts = sourceTemps(beach);
      if (ts.length < 2) return false;
      const vals = ts.map((x) => x.t);
      return Math.max(...vals) - Math.min(...vals) >= 3;
    }

    function disagreeText(beach) {
      return `Las fuentes discrepan (≥3 °C): ${sourceLine(beach)}`;
    }

    function lastKnown(beach) {
      let best = null;
      for (const s of beach.sources || []) {
        for (const d of [...(s.history || []), ...(s.days || [])]) {
          if (!d || typeof d.t !== "number" || !d.date) continue;
          if (refDay && d.date >= refDay) continue;
          if (!best || d.date > best.date) {
            best = { date: d.date, t: d.t, name: s.name };
          }
        }
      }
      return best;
    }

    function dashTip(beach) {
      const last = lastKnown(beach);
      if (!last) return "Sin dato de hoy.";
      return `Sin dato de hoy. Último: ${formatDateEs(last.date)} — ${last.name} ${fmtT(last.t)} °C`;
    }

    function trendGlyph(trend) {
      if (trend === "up") return "↑";
      if (trend === "down") return "↓";
      if (trend === "flat") return "→";
      return "";
    }

    function trendLabel(trend) {
      if (trend === "up") return "subiendo";
      if (trend === "down") return "bajando";
      if (trend === "flat") return "estable";
      return "";
    }

    function collapseRuns(points) {
      const rows = [];
      for (const p of points || []) {
        if (!p || typeof p.t !== "number") continue;
        const last = rows[rows.length - 1];
        if (last && last.t === p.t) {
          last.end = p.date;
        } else {
          rows.push({ start: p.date, end: p.date, t: p.t });
        }
      }
      return rows;
    }

    function formatRange(start, end) {
      if (start === end) return start;
      return `${start} – ${end}`;
    }

    function concelloName(slug) {
      if (!slug) return "";
      const hit = index.concellos.find((c) => c.slug === slug);
      return hit ? hit.name : slug;
    }

    let comboActive = -1;
    let comboFiltered = [];

    function syncClearButton() {
      const input = document.getElementById("concello");
      const btn = document.getElementById("concello-clear");
      btn.hidden = !input.value.trim();
    }

    function setConcelloInput() {
      const input = document.getElementById("concello");
      input.value = currentConcello ? concelloName(currentConcello) : "";
      syncClearButton();
    }

    function sortedConcellos() {
      return [...index.concellos].sort((a, b) =>
        a.name.localeCompare(b.name, "es")
      );
    }

    function filterConcellos(raw) {
      const q = (raw || "").trim().toLowerCase();
      const items = sortedConcellos();
      if (!q) return items;
      return items.filter((c) => c.name.toLowerCase().includes(q));
    }

    function closeCombo() {
      const input = document.getElementById("concello");
      const list = document.getElementById("concello-listbox");
      list.hidden = true;
      input.setAttribute("aria-expanded", "false");
      input.removeAttribute("aria-activedescendant");
      comboActive = -1;
    }

    function openCombo() {
      const input = document.getElementById("concello");
      const list = document.getElementById("concello-listbox");
      list.hidden = false;
      input.setAttribute("aria-expanded", "true");
    }

    function renderComboOptions(query) {
      const list = document.getElementById("concello-listbox");
      comboFiltered = filterConcellos(query);
      if (!comboFiltered.length) {
        list.innerHTML =
          '<li role="presentation" class="empty" style="padding:0.55rem 0.7rem">Sin resultados</li>';
        comboActive = -1;
        openCombo();
        return;
      }
      list.innerHTML = comboFiltered
        .map(
          (c, i) =>
            `<li role="option" id="concello-opt-${i}" data-slug="${c.slug}">${c.name}</li>`
        )
        .join("");
      comboActive = -1;
      openCombo();
    }

    function setComboActive(i) {
      const list = document.getElementById("concello-listbox");
      const input = document.getElementById("concello");
      const opts = [...list.querySelectorAll('[role="option"]')];
      if (!opts.length) return;
      comboActive = ((i % opts.length) + opts.length) % opts.length;
      opts.forEach((el, idx) => {
        el.setAttribute("aria-selected", idx === comboActive ? "true" : "false");
      });
      const active = opts[comboActive];
      input.setAttribute("aria-activedescendant", active.id);
      active.scrollIntoView({ block: "nearest" });
    }

    function ensureConcelloReady() {
      if (currentConcello === null) {
        setConcelloInput();
        return;
      }
      const items = sortedConcellos();
      if (!items.some((c) => c.slug === currentConcello) && items.length) {
        currentConcello = items[0].slug;
      }
      setConcelloInput();
    }

    async function selectConcello(slug) {
      if (!slug || slug === currentConcello) {
        setConcelloInput();
        closeCombo();
        return;
      }
      currentConcello = slug;
      currentBeach = null;
      hideTip();
      setConcelloInput();
      closeCombo();
      setUrl({ c: currentConcello }, { track: true });
      await renderLists();
    }

    async function clearConcello() {
      currentConcello = null;
      currentBeach = null;
      hideTip();
      setConcelloInput();
      closeCombo();
      setUrl({}, { track: true });
      await renderLists();
    }

    async function loadConcello(slug) {
      if (concelloCache.has(slug)) return concelloCache.get(slug);
      const r = await fetch(`./data/${slug}.json`, { cache: "no-store" });
      if (!r.ok) throw new Error(`${r.status}`);
      const json = await r.json();
      concelloCache.set(slug, json);
      return json;
    }

    function hideTip() {
      tipOpen = false;
      tipOwner = null;
      const tip = document.getElementById("tip");
      tip.hidden = true;
      tip.textContent = "";
      document.querySelectorAll(".hint[aria-describedby='tip']").forEach((el) => {
        el.removeAttribute("aria-describedby");
      });
    }

    function showTip(btn, text, clientX, clientY) {
      const tip = document.getElementById("tip");
      tip.textContent = text;
      tip.hidden = false;
      tipOpen = true;
      tipOwner = btn;
      document.querySelectorAll(".hint[aria-describedby='tip']").forEach((el) => {
        el.removeAttribute("aria-describedby");
      });
      btn.setAttribute("aria-describedby", "tip");
      const pad = 12;
      let x = clientX + 10;
      let y = clientY + 10;
      tip.style.left = "0px";
      tip.style.top = "0px";
      const rect = tip.getBoundingClientRect();
      if (x + rect.width > window.innerWidth - pad) {
        x = Math.max(pad, clientX - rect.width - 10);
      }
      if (y + rect.height > window.innerHeight - pad) {
        y = Math.max(pad, clientY - rect.height - 10);
      }
      tip.style.left = `${x}px`;
      tip.style.top = `${y}px`;
    }

    function canHover() {
      return window.matchMedia("(hover: hover)").matches;
    }

    function bindHint(btn) {
      const text = btn.dataset.tip || "";

      btn.addEventListener("mouseenter", (e) => {
        if (!canHover()) return;
        showTip(btn, text, e.clientX, e.clientY);
      });
      btn.addEventListener("mousemove", (e) => {
        if (!canHover() || !tipOpen) return;
        showTip(btn, text, e.clientX, e.clientY);
      });
      btn.addEventListener("mouseleave", () => {
        if (!canHover()) return;
        hideTip();
      });
      btn.addEventListener("focus", () => {
        const r = btn.getBoundingClientRect();
        showTip(btn, text, r.left + r.width / 2, r.bottom);
      });
      btn.addEventListener("blur", () => hideTip());
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (tipOpen && tipOwner === btn) {
          hideTip();
          return;
        }
        const r = btn.getBoundingClientRect();
        showTip(btn, text, r.left + r.width / 2, r.bottom);
      });
    }

    function beachConcelloLabel(beach) {
      return (
        beach.concello ||
        concelloName(index.beachConcello[beach.slug] || beach.concelloSlug)
      );
    }

    function accordionHtml(beach) {
      const concello = beachConcelloLabel(beach);
      const parts = [
        `<h3>${beach.name}</h3><p class="src">${concello}</p>`,
      ];
      const q = encodeURIComponent(`${beach.name}, ${concello}, Galicia`);
      parts.push(
        `<a class="maps" target="_blank" rel="noopener" ` +
          `href="https://www.google.com/maps/search/?api=1&amp;query=${q}">Ver en Google Maps</a>`
      );
      for (const s of beach.sources || []) {
        parts.push(`<h4>${s.name}</h4>`);
        const hist = collapseRuns(s.history || []);
        const days = collapseRuns(s.days || []);
        if (hist.length) {
          parts.push(
            "<table><thead><tr><th>Histórico</th><th>Agua</th></tr></thead><tbody>"
          );
          for (const r of hist) {
            parts.push(
              `<tr><td>${formatRange(r.start, r.end)}</td><td>${fmtT(r.t)} °C</td></tr>`
            );
          }
          parts.push("</tbody></table>");
        }
        if (days.length) {
          parts.push(
            "<table><thead><tr><th>Pronóstico</th><th>Agua</th></tr></thead><tbody>"
          );
          for (const r of days) {
            parts.push(
              `<tr><td>${formatRange(r.start, r.end)}</td><td>${fmtT(r.t)} °C</td></tr>`
            );
          }
          parts.push("</tbody></table>");
        }
      }
      return parts.join("");
    }

    function escapeAttr(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function rowHtml(beach, { topMode = false } = {}) {
      const hasT = typeof beach.t === "number";
      const band = hasT ? bandFor(beach.t) : null;
      const bandCls = band ? band.cls : "";
      let tipBtn = "";
      if (hasT && disagree(beach)) {
        tipBtn = `<button type="button" class="hint" data-tip="${escapeAttr(
          disagreeText(beach)
        )}" aria-label="Fuentes discrepan">?</button>`;
      } else if (!hasT) {
        tipBtn = `<button type="button" class="hint" data-tip="${escapeAttr(
          dashTip(beach)
        )}" aria-label="Sin dato de hoy">?</button>`;
      }
      const g = hasT ? trendGlyph(beach.trend) : "";
      const trend = g
        ? `<span class="trend" title="${trendLabel(beach.trend)}">${g}</span>`
        : "";
      const active = currentBeach === beach.slug ? " active" : "";
      const open = currentBeach === beach.slug;
      const tempText = hasT ? `${fmtT(beach.t)} °C${trend}` : "—";
      const src = sourceLine(beach, { withConcello: topMode });
      return `<li>
        <div class="row ${bandCls}${active}">
          <button type="button" class="row-main" data-slug="${beach.slug}" aria-expanded="${
        open ? "true" : "false"
      }">
            <span class="name">${beach.name}</span>
            <span class="temp ${bandCls}">${tempText}</span>
            <span class="src">${src}</span>
          </button>
          ${tipBtn}
        </div>
        ${
          open
            ? `<div class="accordion" data-for="${beach.slug}">${accordionHtml(
                beach
              )}</div>`
            : ""
        }
      </li>`;
    }

    function sortBeaches(items) {
      return [...items].sort((a, b) => {
        if (typeof a.t === "number" && typeof b.t === "number" && b.t !== a.t) {
          return b.t - a.t;
        }
        return a.name.localeCompare(b.name, "es");
      });
    }

    function renderBanded(beaches, { topMode = false } = {}) {
      const withT = beaches.filter((b) => typeof b.t === "number");
      const withoutT = beaches.filter(
        (b) => typeof b.t !== "number" && (b.sources || []).length
      );
      const parts = [];
      for (const band of BANDS) {
        const items = sortBeaches(
          withT.filter((b) => bandFor(b.t)?.id === band.id)
        );
        if (!items.length) continue;
        parts.push(
          `<section><h2>${band.title}</h2><ul class="beach-list">${items
            .map((b) => rowHtml(b, { topMode }))
            .join("")}</ul></section>`
        );
      }
      if (withoutT.length) {
        const items = [...withoutT].sort((a, b) =>
          a.name.localeCompare(b.name, "es")
        );
        parts.push(
          `<section><h2>Sin dato de hoy</h2><ul class="beach-list">${items
            .map((b) => rowHtml(b, { topMode }))
            .join("")}</ul></section>`
        );
      }
      return parts;
    }

    function bindList(root) {
      root.querySelectorAll("button.row-main").forEach((btn) => {
        btn.addEventListener("click", () => {
          const slug = btn.dataset.slug;
          if (currentBeach === slug) closeBeach();
          else openBeach(slug);
        });
      });
      root.querySelectorAll("button.hint").forEach(bindHint);
    }

    async function enrichTopBeach(beach) {
      if ((beach.sources || []).some((s) => s.history)) return beach;
      const cslug = index.beachConcello[beach.slug] || beach.concelloSlug;
      if (!cslug) return beach;
      try {
        const payload = await loadConcello(cslug);
        const full = (payload.beaches || []).find((b) => b.slug === beach.slug);
        if (full) {
          return {
            ...beach,
            ...full,
            concello: beach.concello || beachConcelloLabel(beach),
            concelloSlug: cslug,
          };
        }
      } catch (_) {
        /* keep slim */
      }
      return beach;
    }

    async function renderLists() {
      const root = document.getElementById("lists");
      root.innerHTML = '<p class="empty">Cargando…</p>';

      if (currentConcello === null) {
        let top = [...(index.top || [])];
        if (currentBeach) {
          const idx = top.findIndex((b) => b.slug === currentBeach);
          if (idx >= 0) {
            top[idx] = await enrichTopBeach(top[idx]);
          }
        }
        const parts = renderBanded(top, { topMode: true });
        root.innerHTML = parts.length
          ? `<h2>Las más cálidas</h2>${parts.join("")}`
          : '<p class="empty">Sin destacadas.</p>';
        bindList(root);
        return;
      }

      let payload;
      try {
        payload = await loadConcello(currentConcello);
      } catch (err) {
        root.innerHTML = `<p class="empty">No se pudo cargar ${currentConcello} (${err.message}).</p>`;
        return;
      }
      const beaches = payload.beaches || [];
      const parts = renderBanded(beaches, { topMode: false });
      root.innerHTML =
        parts.join("") || '<p class="empty">Sin datos para este concello.</p>';
      bindList(root);
    }

    async function openBeach(slug, { push = true } = {}) {
      const mapped = index.beachConcello[slug];
      if (currentConcello === null) {
        currentBeach = slug;
        // stay in top; load history without changing URL / concello
        await renderLists();
        const acc = document.querySelector(`.accordion[data-for="${slug}"]`);
        if (acc) acc.scrollIntoView({ block: "nearest", behavior: "smooth" });
        return;
      }
      if (mapped) currentConcello = mapped;
      currentBeach = slug;
      setConcelloInput();
      if (push) setUrl({ c: currentConcello, b: slug }, { track: true });
      await renderLists();
      const acc = document.querySelector(`.accordion[data-for="${slug}"]`);
      if (acc) acc.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function closeBeach({ push = true } = {}) {
      currentBeach = null;
      hideTip();
      if (push) {
        if (currentConcello === null) setUrl({}, { track: true });
        else setUrl({ c: currentConcello }, { track: true });
      }
      renderLists();
    }

    function applyStale() {
      const el = document.getElementById("stale");
      const day = dayOf(index.fetchedAt);
      document.getElementById("fetchedAt").textContent = index.fetchedAt || "—";
      if (day && day !== todayLocalISO()) {
        el.hidden = false;
        el.textContent = `Datos del ${formatDateEs(day)}.`;
      } else {
        el.hidden = true;
      }
    }

    async function bootFromQuery() {
      const { c, b } = parseQuery();
      if (b && index.beachConcello[b]) {
        currentConcello = index.beachConcello[b];
      } else if (c) {
        currentConcello = c;
      } else {
        currentConcello = null;
      }
      ensureConcelloReady();
      if (b) await openBeach(b, { push: false });
      else await renderLists();
    }

    const concelloInput = document.getElementById("concello");
    const concelloList = document.getElementById("concello-listbox");
    const concelloClear = document.getElementById("concello-clear");

    concelloClear.addEventListener("click", (e) => {
      e.preventDefault();
      clearConcello();
    });

    concelloInput.addEventListener("focus", () => {
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("click", () => {
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("input", () => {
      syncClearButton();
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("keydown", async (e) => {
      const open = concelloInput.getAttribute("aria-expanded") === "true";
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!open) renderComboOptions(concelloInput.value);
        setComboActive(comboActive + 1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (!open) renderComboOptions(concelloInput.value);
        setComboActive(comboActive - 1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (comboActive >= 0 && comboFiltered[comboActive]) {
          await selectConcello(comboFiltered[comboActive].slug);
        } else {
          const hits = filterConcellos(concelloInput.value);
          const exact = hits.find(
            (c) =>
              c.name.toLowerCase() === concelloInput.value.trim().toLowerCase()
          );
          if (exact) await selectConcello(exact.slug);
          else if (hits.length === 1) await selectConcello(hits[0].slug);
          else {
            setConcelloInput();
            closeCombo();
          }
        }
      } else if (e.key === "Escape") {
        e.preventDefault();
        setConcelloInput();
        closeCombo();
      }
    });

    concelloList.addEventListener("mousedown", (e) => {
      const opt = e.target.closest('[role="option"]');
      if (!opt) return;
      e.preventDefault();
      selectConcello(opt.dataset.slug);
    });

    concelloInput.addEventListener("blur", () => {
      window.setTimeout(() => {
        if (document.activeElement === concelloInput) return;
        if (document.activeElement === concelloClear) return;
        setConcelloInput();
        closeCombo();
      }, 120);
    });

    window.addEventListener("popstate", async () => {
      const { c, b } = parseQuery();
      if (b && index.beachConcello[b]) currentConcello = index.beachConcello[b];
      else if (c) currentConcello = c;
      else currentConcello = null;
      setConcelloInput();
      closeCombo();
      if (b) await openBeach(b, { push: false });
      else {
        currentBeach = null;
        hideTip();
        await renderLists();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideTip();
    });
    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".combo")) return;
      if (concelloInput.getAttribute("aria-expanded") === "true") {
        setConcelloInput();
        closeCombo();
      }
      if (!tipOpen) return;
      const tip = document.getElementById("tip");
      if (e.target.closest(".hint") || tip.contains(e.target)) return;
      hideTip();
    });

    fetch("./data/index.json", { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error(`${r.status}`);
        return r.json();
      })
      .then(async (json) => {
        index = json;
        if (!index.top) index.top = [];
        refDay = dayOf(index.fetchedAt);
        applyStale();
        await bootFromQuery();
      })
      .catch((err) => {
        document.getElementById("lists").innerHTML =
          `<p class="empty">No se pudo cargar data/index.json (${err.message}).</p>`;
      });
  </script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="d4689bbc-a673-4072-a3e0-5c8a7b5f16c9"></script>
