<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temperatura del agua — playas de Galicia</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #9aabbc;
      --accent: #3db8a8;
      --warn: #e0a106;
      --border: #2a3542;
      --calida: #3dba6e;
      --templada: #d4b106;
      --fria: #e05252;
      --dogs: #e4b86a;
      --fs-xs: 0.75rem;
      --fs-sm: 0.875rem;
      --fs-md: 1rem;
      --fs-lg: 1.125rem;
      --fs-xl: 1.375rem;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: var(--fs-md);
      line-height: 1.45;
      touch-action: manipulation;
    }
    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }
    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin: 0 0 0.35rem;
    }
    .title-row h1 {
      font-size: var(--fs-xl);
      font-weight: 650;
      margin: 0;
      text-wrap: balance;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    #lang-bar button,
    #sort-bar button,
    #caninas-toggle,
    #geo-near,
    #beach-dialog-close,
    #concello-clear,
    .show-more,
    .maps {
      position: relative;
      box-sizing: border-box;
      height: 1.75rem;
      min-height: 1.75rem;
      min-width: 1.75rem;
      padding: 0 0.5rem;
      border: 0;
      border-radius: 0.3rem;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: var(--fs-sm);
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #lang-bar button:hover,
    #sort-bar button:hover,
    #caninas-toggle:hover,
    #geo-near:hover,
    #beach-dialog-close:hover,
    #concello-clear:hover,
    .show-more:hover {
      background: color-mix(in srgb, var(--text) 8%, transparent);
      color: var(--text);
    }
    #lang-bar button[aria-checked="true"],
    #sort-bar button[aria-checked="true"],
    #caninas-toggle[aria-pressed="true"] {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent);
    }
    #lang-bar button:focus-visible,
    #sort-bar button:focus-visible,
    #caninas-toggle:focus-visible,
    #geo-near:focus-visible,
    #beach-dialog-close:focus-visible,
    #concello-clear:focus-visible,
    .show-more:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    #lang-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.2rem;
      flex: 0 0 auto;
    }
    .sub {
      color: var(--muted);
      font-size: var(--fs-sm);
      margin-bottom: 1rem;
    }
    label { font-size: var(--fs-sm); color: var(--muted); display: block; margin-bottom: 0.35rem; }
    .combo-row {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
      margin-bottom: 1.25rem;
    }
    .combo {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    #geo-near {
      flex: 0 0 auto;
      align-self: stretch;
      height: auto;
      min-height: 0;
    }
    #concello {
      width: 100%;
      padding: 0.65rem 2.85rem 0.65rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: var(--fs-md);
    }
    #concello:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    #concello-clear {
      position: absolute;
      right: 0.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: var(--fs-lg);
      line-height: 1;
    }
    #concello-clear[hidden] { display: none; }
    #concello-listbox {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      top: calc(100% + 0.25rem);
      margin: 0;
      padding: 0.25rem;
      list-style: none;
      max-height: min(16rem, 50vh);
      overflow: auto;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }
    #concello-listbox[hidden] { display: none; }
    #concello-listbox [role="option"] {
      padding: 0.55rem 0.7rem;
      border-radius: 0.35rem;
      cursor: pointer;
    }
    #concello-listbox [role="option"][aria-selected="true"],
    #concello-listbox [role="option"]:hover {
      background: #24303c;
      color: var(--accent);
    }
    h2 {
      font-size: var(--fs-sm);
      font-weight: 600;
      margin: 1.4rem 0 0.55rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    h3 {
      font-size: var(--fs-sm);
      font-weight: 600;
      margin: 0.85rem 0 0.45rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .list-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin: 0 0 1rem;
    }
    #sort-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.2rem;
      margin: 0;
    }
    #sort-legend {
      font-size: var(--fs-sm);
      color: var(--muted);
      margin-right: 0.15rem;
    }
    ul.beach-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      align-items: stretch;
    }
    @media (min-width: 32rem) {
      ul.beach-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 48rem) {
      ul.beach-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
      min-width: 0;
      padding: 0.8rem 0.85rem;
      border-radius: 0.65rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: inherit;
      height: 100%;
    }
    .card:hover, .card.is-open { border-color: var(--accent); }
    .card.band-calida { border-color: color-mix(in srgb, var(--calida) 55%, var(--border)); }
    .card.band-templada { border-color: color-mix(in srgb, var(--templada) 45%, var(--border)); }
    .card.band-fria { border-color: color-mix(in srgb, var(--fria) 55%, var(--border)); }
    .card-hit {
      position: absolute;
      inset: 0;
      z-index: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: inherit;
      background: none;
      cursor: pointer;
    }
    .card-hit:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 2px;
    }
    .card-head {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      min-width: 0;
      pointer-events: none;
    }
    .card-ident {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
    }
    .card-name {
      min-width: 0;
      font-size: var(--fs-sm);
      font-weight: 600;
      line-height: 1.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-city {
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: 400;
      line-height: 1.15;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-actions {
      flex: 0 0 auto;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      pointer-events: auto;
    }
    .card-actions .hint.dogs-badge {
      height: 1.5rem;
    }
    .hint.dogs-badge {
      flex: 0 0 auto;
      position: relative;
      box-sizing: border-box;
      width: 1.5rem;
      min-width: 1.5rem;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--dogs);
      font-size: var(--fs-sm);
      font-weight: 600;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .hint.dogs-badge .ico {
      width: 1.5rem;
      height: 1.5rem;
    }
    .hint.dogs-badge[hidden] {
      display: none;
    }
    .hint.dogs-badge::after {
      content: "";
      position: absolute;
      inset: -0.62rem;
    }
    .dialog-head .dogs-badge {
      width: auto;
      padding: 0 0.4rem;
      gap: 0.25rem;
      font-size: var(--fs-xs);
    }
    .dialog-head .dogs-badge .ico {
      width: 1rem;
      height: 1rem;
    }
    .dialog-dogs {
      margin: 0 0 0.75rem;
      font-size: var(--fs-sm);
      color: var(--muted);
    }
    .dialog-dogs a { color: var(--accent); }
    .card-metrics {
      margin-top: auto;
      padding-top: 1rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      min-width: 0;
      position: relative;
      z-index: 1;
      pointer-events: none;
      font-size: var(--fs-sm);
      font-variant-numeric: tabular-nums;
    }
    .card-temp-cluster,
    .card-score-cluster {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      min-width: 0;
    }
    .card-temp-cluster {
      align-items: flex-start;
    }
    .card-score-cluster {
      align-items: flex-end;
      margin-left: auto;
    }
    .card-metrics .temp {
      display: inline-flex;
      align-items: baseline;
      gap: 0.2rem;
    }
    .card-score-label,
    .card-temp-unit {
      font-size: var(--fs-xs);
      font-weight: 600;
      line-height: 1;
    }
    .card-score-label {
      color: var(--muted);
    }
    .hint.card-score-label {
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: 600;
    }
    .hint.card-score-label::after {
      content: "";
      position: absolute;
      inset: -0.4rem -0.2rem;
    }
    .card-score,
    .card-temp {
      font-size: var(--fs-sm);
      font-weight: 650;
      line-height: 1;
    }
    .card-temp {
      white-space: nowrap;
    }
    .card-temp-cluster .hint {
      display: inline;
      font-size: var(--fs-sm);
      line-height: 1;
    }
    .card-temp-cluster .hint.card-score-label,
    .card-facts .hint.card-score-label {
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--muted);
    }
    .temp.band-calida { color: var(--calida); }
    .temp.band-templada { color: var(--templada); }
    .temp.band-fria { color: var(--fria); }
    .trend { font-weight: 700; line-height: 1; }
    .hint {
      pointer-events: auto;
      position: relative;
      min-width: 0;
      min-height: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--warn);
      cursor: help;
      font-weight: 650;
      border: 0;
      background: transparent;
      padding: 0;
      font-size: var(--fs-xs);
      line-height: 1;
    }
    .card-temp-cluster .hint::after {
      content: "";
      position: absolute;
      inset: -0.55rem;
    }
    .card-facts {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: var(--fs-sm);
      font-variant-numeric: tabular-nums;
    }
    .card-facts li {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.3rem 0;
    }
    .card-facts li.fact-figure {
      align-items: flex-start;
    }
    .fact-figure-body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.45rem;
    }
    .card-facts .hint::after {
      content: "";
      position: absolute;
      inset: -0.4rem -0.2rem;
    }
    .card-facts li.score-bar {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.35rem;
      padding: 0.55rem 0;
    }
    .bar-label {
      display: grid;
      grid-template-columns: 1em minmax(0, 1fr);
      column-gap: 0.4rem;
      align-items: center;
    }
    .bar-hint {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      width: 100%;
      min-width: 0;
      min-height: 0;
      justify-self: stretch;
      color: inherit;
      font-weight: 650;
      font-size: inherit;
    }
    .bar-qual {
      flex-shrink: 0;
      font-weight: 400;
      color: var(--text);
    }
    .score-bar .bar-track {
      --bar-mark: 0.75rem;
      display: grid;
      align-items: center;
      margin-left: calc(1em + 0.4rem);
      width: auto;
      line-height: 0;
    }
    .hint:focus-visible,
    .bar-hint:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    .bar {
      display: block;
      grid-area: 1 / 1;
      width: 100%;
      min-width: 0;
      height: 0.45rem;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }
    .bar-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
    }
    .bar-mark {
      grid-area: 1 / 1;
      position: relative;
      justify-self: start;
      width: var(--bar-mark);
      height: var(--bar-mark);
      border-radius: 50%;
      left: calc(var(--pos) * (100% - var(--bar-mark)) / 100);
    }
    .ico {
      flex: 0 0 1em;
      width: 1em;
      height: 1em;
    }
    .uv-warn { color: var(--warn); margin: 0.35rem 0 0.45rem; }
    .show-more {
      display: block;
      width: 100%;
      margin-top: 1rem;
    }
    .maps {
      z-index: 2;
      color: var(--accent);
      text-decoration: none;
    }
    .maps::after {
      content: "";
      position: absolute;
      inset: -0.5rem -0.25rem;
    }
    .maps:hover {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
    }
    .maps:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    #beach-dialog {
      width: min(36rem, calc(100vw - 1.5rem));
      max-height: min(80vh, 40rem);
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      overscroll-behavior: contain;
      margin: auto;
      padding: 1rem max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      background: var(--card);
      color: var(--text);
      color-scheme: dark;
    }
    #beach-dialog::-webkit-scrollbar { display: none; }
    #beach-dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
    @media (prefers-reduced-motion: reduce) {
      #beach-dialog, #beach-dialog::backdrop {
        animation: none;
        transition: none;
      }
    }
    .dialog-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .dialog-title {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: var(--fs-lg);
      font-weight: 650;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
      text-wrap: balance;
    }
    .dialog-head .maps { grid-column: auto; grid-row: auto; justify-self: auto; }
    #beach-dialog-close {
      flex: 0 0 auto;
      font-size: var(--fs-lg);
    }
    #beach-dialog h4 {
      margin: 0.75rem 0 0.25rem;
      font-size: var(--fs-sm);
      color: var(--muted);
    }
    #beach-dialog table { table-layout: fixed; width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
    #beach-dialog col.col-day { width: 28%; }
    #beach-dialog col.col-metric { width: 18%; }
    #beach-dialog th, #beach-dialog td {
      text-align: left;
      padding: 0.35rem 0.25rem;
      border-bottom: 1px solid var(--border);
    }
    #beach-dialog th:not(:first-child),
    #beach-dialog td:not(:first-child) {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #tip {
      position: fixed;
      z-index: 40;
      max-width: min(18rem, calc(100vw - 1.5rem));
      padding: 0.55rem 0.7rem;
      border-radius: 0.45rem;
      border: 1px solid var(--warn);
      background: #2a2414;
      color: #f5e6b8;
      font-size: var(--fs-sm);
      line-height: 1.35;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    #tip[hidden] { display: none; }
    footer {
      margin-top: 2rem;
      font-size: var(--fs-xs);
      color: var(--muted);
    }
    footer a { color: var(--accent); }
    .empty { color: var(--muted); font-size: var(--fs-sm); padding: 0.5rem 0; }
  </style>
</head>
<body>
  <main>
    <div class="title-row">
      <h1 data-i18n="title">Temperatura del agua</h1>
      <div id="lang-bar" role="radiogroup" aria-labelledby="lang-legend">
        <span id="lang-legend" class="sr-only" data-i18n="langLegend">Idioma</span>
        <button type="button" role="radio" data-lang="es" aria-checked="true">ES</button>
        <button type="button" role="radio" data-lang="en" aria-checked="false">EN</button>
        <button type="button" role="radio" data-lang="ru" aria-checked="false">RU</button>
      </div>
    </div>
    <p class="sub" data-i18n="subtitle">No son mediciones in situ en la orilla.</p>
    <label for="concello" data-i18n="concelloLabel">Concello</label>
    <div class="combo-row">
    <div class="combo">
      <input
        id="concello"
        role="combobox"
        aria-expanded="false"
        aria-controls="concello-listbox"
        aria-autocomplete="list"
        autocomplete="off"
        data-i18n-placeholder="concelloPlaceholder"
        placeholder="Buscar concello…"
      />
      <button type="button" id="concello-clear" hidden data-i18n-aria="concelloClear" aria-label="Limpiar">×</button>
      <ul id="concello-listbox" role="listbox" hidden></ul>
    </div>
    <button type="button" id="geo-near" data-i18n="geoNear" data-i18n-aria="geoNearAria" aria-label="Playas cercanas">Cerca</button>
    </div>
    <p id="geo-status" class="empty" aria-live="polite" hidden></p>
    <div class="list-toolbar">
    <div id="sort-bar" role="radiogroup" aria-labelledby="sort-legend">
      <span id="sort-legend" data-i18n="sortLegend">Ordenar</span>
      <button type="button" role="radio" data-ord="agua" aria-checked="true" data-i18n="sortAgua">Agua</button>
        <button type="button" role="radio" data-ord="indice" aria-checked="false" data-i18n="sortIndice">Confort</button>
    </div>
    <button type="button" id="caninas-toggle" aria-pressed="false" data-i18n="caninas">Caninas</button>
    </div>
    <div id="lists"></div>
    <dialog id="beach-dialog" aria-labelledby="beach-dialog-title">
      <div class="dialog-head">
        <h2 class="dialog-title" id="beach-dialog-title"></h2>
        <a class="maps" id="beach-dialog-maps" target="_blank" rel="noopener" data-i18n="maps">Mapa</a>
        <button type="button" id="beach-dialog-close" data-i18n-aria="dialogClose" aria-label="Cerrar">×</button>
      </div>
      <div id="beach-dialog-body"></div>
    </dialog>
    <footer>
      <span data-i18n="footerDatos">Datos:</span>
      <a href="https://marine.copernicus.eu/" rel="noopener">E.U. Copernicus Marine Service</a>,
      <a href="https://www.meteogalicia.gal/" rel="noopener">MeteoGalicia</a>
      /
      <a href="https://www.meteogalicia.gal/web/modelos-numericos/meteosix" rel="noopener">MeteoSIX</a>
      <span data-i18n="footerY">y</span>
      <a href="https://www.aemet.es/" rel="noopener">AEMET</a>.
      <span data-i18n="footerLicencias">Licencias:</span>
      <a href="DATA-LICENSE.md" data-i18n="footerPorFuente">por fuente</a>.
      <span data-i18n="footerActualizado">Actualizado:</span>
      <span id="fetchedAt">—</span>.
      <a href="https://www.turismo.gal/" rel="noopener" data-i18n="footerTurismo">Agencia de Turismo de Galicia</a>.
    </footer>
  </main>

      if (listOrd === "indice") clean.ord = "indice";

      if (lang !== "es") clean.lang = lang;
      else delete clean.lang;
      const q = new URLSearchParams(clean).toString();
      const url = q ? `?${q}` : location.pathname;
      if (replace) history.replaceState(null, "", url);
      else history.pushState(null, "", url);
    }

    function dayOf(iso) {
      return (iso || "").slice(0, 10);
    }

    function formatDateEs(isoDay) {
      if (!isoDay) return "";
      const [y, m, d] = isoDay.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString(localeTag(), { day: "numeric", month: "long" });
    }

    function formatDay(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const raw = new Intl.DateTimeFormat(localeTag(), {
        weekday: "long",
        day: "numeric",
      }).format(new Date(y, m - 1, d));
      return raw.charAt(0).toLocaleUpperCase(lang) + raw.slice(1);
    }

    function fmtT(t) {
      return Number(t).toLocaleString(localeTag(), {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1,
      });
    }

    function bandFor(t) {
      if (typeof t !== "number") return null;
      if (t >= 20) return BANDS[0];
      if (t >= 17) return BANDS[1];
      return BANDS[2];
    }

    function dayEntry(days, day) {
      return (days || []).find(
        (d) => d && d.date === day && typeof d.t === "number"
      );
    }

    function costaOf(beach) {
      if (!beach.source || beach.source === "Copernicus") return null;
      if (typeof beach.t !== "number") return null;
      return { name: beach.source, t: beach.t };
    }

    function marOf(beach) {
      const s = (beach.sources || []).find((x) => x.name === "Copernicus");
      if (!s) return null;
      const d = dayEntry(s.days, refDay);
      return d ? { name: "Copernicus", t: d.t } : null;
    }

    function disagree(beach) {
      const costa = costaOf(beach);
      const mar = marOf(beach);
      if (!costa || !mar) return false;
      return Math.abs(costa.t - mar.t) >= 3;
    }

    function disagreeText(beach) {
      const costa = costaOf(beach);
      const mar = marOf(beach);
      return t("disagree", {
        costaT: fmtT(costa.t),
        costaName: costa.name,
        marT: fmtT(mar.t),
        marName: mar.name,
      });
    }

    function lastKnown(beach) {
      let best = null;
      for (const s of beach.sources || []) {
        for (const d of [...(s.history || []), ...(s.days || [])]) {
          if (!d || typeof d.t !== "number" || !d.date) continue;
          if (refDay && d.date >= refDay) continue;
          if (!best || d.date > best.date) {
            best = { date: d.date, t: d.t, name: s.name };
          }
        }
      }
      return best;
    }

    function dashTip(beach) {
      const last = lastKnown(beach);
      if (!last) return t("nodata");
      return t("nodataLast", {
        date: formatDateEs(last.date),
        name: last.name,
        t: fmtT(last.t),

      const q = (raw || "").trim().toLowerCase();

    function renderComboOptions(query) {
      const list = document.getElementById("concello-listbox");
      comboFiltered = filterConcellos(query);
      if (!comboFiltered.length) {
        list.innerHTML =
          `<li role="presentation" class="empty" style="padding:0.55rem 0.7rem">${t("noCombo")}</li>`;
        comboActive = -1;
        openCombo();
        return;
      }
      list.innerHTML = comboFiltered
        .map(
          (c, i) =>
            `<li role="option" id="concello-opt-${i}" data-slug="${c.slug}">${c.name}</li>`
        )
        .join("");
      comboActive = -1;
      openCombo();
    }

    function setComboActive(i) {
      const list = document.getElementById("concello-listbox");
      const input = document.getElementById("concello");
      const opts = [...list.querySelectorAll('[role="option"]')];
      if (!opts.length) return;
      comboActive = ((i % opts.length) + opts.length) % opts.length;
      opts.forEach((el, idx) => {
        el.setAttribute("aria-selected", idx === comboActive ? "true" : "false");
      });
      const active = opts[comboActive];
      input.setAttribute("aria-activedescendant", active.id);
      active.scrollIntoView({ block: "nearest" });
    }

    function ensureConcelloReady() {
      if (currentConcello === null) {
        setConcelloInput();
        return;
      }
      const items = sortedConcellos();
      if (!items.some((c) => c.slug === currentConcello) && items.length) {
        currentConcello = items[0].slug;
      }
      setConcelloInput();
    }

    async function selectConcello(slug) {
      geoMode = false;
      caninasMode = false;
      setGeoStatus("");
      concelloShowAll = false;
      if (!slug || slug === currentConcello) {
        setConcelloInput();
        closeCombo();
        await renderLists();
        return;
      }
      currentConcello = slug;
      currentBeach = null;
      geoMode = false;
      hideTip();
      setConcelloInput();
      closeCombo();
      setUrl({ c: currentConcello });
      track("concello_select", { slug: currentConcello });
      await renderLists();
    }

    async function clearConcello() {
      geoMode = false;
      caninasMode = false;
      setGeoStatus("");
      currentConcello = null;
      currentBeach = null;
      geoMode = false;
      concelloShowAll = false;
      hideTip();
      setConcelloInput();
      closeCombo();
      setUrl({});
      track("top_view");
      await renderLists();
    }

    async function loadConcello(slug) {
      if (concelloCache.has(slug)) return concelloCache.get(slug);
      const r = await fetch(`./data/${slug}.json`, { cache: "no-store" });
      if (!r.ok) throw new Error(`${r.status}`);
      const json = await r.json();
      concelloCache.set(slug, json);
      return json;
    }

    function hideTip() {
      tipOpen = false;
      tipOwner = null;
      const tip = document.getElementById("tip");
      tip.hidden = true;
      tip.textContent = "";
      if (tip.parentElement !== document.body) {
        document.body.appendChild(tip);
      }
      document.querySelectorAll(".hint[aria-describedby='tip']").forEach((el) => {
        el.removeAttribute("aria-describedby");
      });
    }

    function showTip(btn, text, clientX, clientY) {
      const tip = document.getElementById("tip");
      const dlg = document.getElementById("beach-dialog");
      const host = dlg && dlg.open && dlg.contains(btn) ? dlg : document.body;
      if (tip.parentElement !== host) host.appendChild(tip);
      tip.textContent = text;
      tip.hidden = false;
      tipOpen = true;
      tipOwner = btn;
      document.querySelectorAll(".hint[aria-describedby='tip']").forEach((el) => {
        el.removeAttribute("aria-describedby");
      });
      btn.setAttribute("aria-describedby", "tip");
      const pad = 12;
      let x = clientX + 10;
      let y = clientY + 10;
      tip.style.left = "0px";
      tip.style.top = "0px";
      const rect = tip.getBoundingClientRect();
      if (x + rect.width > window.innerWidth - pad) {
        x = Math.max(pad, clientX - rect.width - 10);
      }
      if (y + rect.height > window.innerHeight - pad) {
        y = Math.max(pad, clientY - rect.height - 10);
      }
      tip.style.left = `${x}px`;
      tip.style.top = `${y}px`;
    }

    function canHover() {
      return window.matchMedia("(hover: hover)").matches;
    }

    function bindHint(btn) {
      const tipText = () => btn.dataset.tip || "";

      btn.addEventListener("mouseenter", (e) => {
        if (!canHover()) return;
        showTip(btn, tipText(), e.clientX, e.clientY);
      });
      btn.addEventListener("mousemove", (e) => {
        if (!canHover() || !tipOpen) return;
        showTip(btn, tipText(), e.clientX, e.clientY);
      });
      btn.addEventListener("mouseleave", () => {
        if (!canHover()) return;
        hideTip();
      });
      btn.addEventListener("focus", () => {
        const r = btn.getBoundingClientRect();
        showTip(btn, tipText(), r.left + r.width / 2, r.bottom);
      });
      btn.addEventListener("blur", () => hideTip());
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (tipOpen && tipOwner === btn) {
          hideTip();
          return;
        }
        track("hint_open", { kind: btn.dataset.kind || "disagree" });
        const r = btn.getBoundingClientRect();
        showTip(btn, tipText(), r.left + r.width / 2, r.bottom);
      });
    }

    function setGeoStatus(msg) {
      const el = document.getElementById("geo-status");
      if (!el) return;
      if (!msg) {
        el.hidden = true;
        el.textContent = "";
        return;
      }
      el.hidden = false;
      el.textContent = msg;
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const rad = (d) => (d * Math.PI) / 180;
      const dLat = rad(lat2 - lat1);
      const dLon = rad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function nearbyBeaches(lat, lon) {
      const hit = [];
      for (const b of index.geo || []) {
        if (typeof b.lat !== "number" || typeof b.lon !== "number") continue;
        const km = haversineKm(lat, lon, b.lat, b.lon);
        if (km > GEO_RADIUS_KM) continue;
        if (listOrd === "agua" && typeof b.t !== "number") continue;
        hit.push({ ...b, km });
      }
      hit.sort((a, b) => a.km - b.km);
      return hit.slice(0, GEO_CAP);
    }

    function beachConcelloLabel(beach) {
      return (
        beach.concello ||
        concelloName(index.beachConcello[beach.slug] || beach.concelloSlug)
      );
    }

    function seriesByDay(src) {
      const m = new Map();
      if (!src) return m;
      for (const d of [...(src.history || []), ...(src.days || [])]) {
        if (d && d.date && typeof d.t === "number") m.set(d.date, d.t);
      }
      return m;
    }

    function uvLabel(uv) {
      if (typeof uv !== "number") return "";
      if (uv <= 2) return t("uvBajo");
      if (uv <= 5) return t("uvModerado");
      if (uv <= 7) return t("uvAlto");
      if (uv <= 10) return t("uvMuyAlto");
      return t("uvExtremo");
    }

    function accordionTable(title, dates, costaDays, marDays, uvDays, costaName, scoreByDay) {
      if (!dates.length) return "";
      const costaTitle = costaName ? t("segun", { name: costaName }) : "";
      const showScore = Boolean(scoreByDay);
      const heads = [
        `<th>${t("tableDay")}</th>`,
        showScore
          ? `<th>${t("indiceLabel")}</th>`
          : `<th aria-hidden="true"></th>`,
        `<th title="${escapeAttr(costaTitle)}">${t("tableCosta")}</th>`,
        `<th title="${escapeAttr(t("segunCopernicus"))}">${t("tableMar")}</th>`,
        `<th title="${escapeAttr(t("uvTitle"))}">${t("tableUv")}</th>`,
      ];
      const rows = dates.map((d) => {
        const tC = costaDays.get(d);
        const tM = marDays.get(d);
        const uv = uvDays.get(d);
        const sc = scoreByDay && scoreByDay[d];
        const scoreCell = showScore
          ? `<td>${sc && typeof sc.score === "number" ? sc.score : "—"}</td>`
          : `<td aria-hidden="true"></td>`;
        return (
          `<tr><td>${formatDay(d)}</td>` +
          `${scoreCell}` +
          `<td>${tC == null ? "—" : `${fmtT(tC)} °C`}</td>` +
          `<td>${tM == null ? "—" : `${fmtT(tM)} °C`}</td>` +
          `<td>${typeof uv === "number" ? `${uv} ${uvLabel(uv)}` : "—"}</td></tr>`
        );
      });
      const cols = `<col class="col-day">${"<col class=\"col-metric\">".repeat(4)}`;
      return (
        `<h4>${title}</h4><table><colgroup>${cols}</colgroup>` +
        `<thead><tr>${heads.join("")}</tr></thead>` +
        `<tbody>${rows.join("")}</tbody></table>`
      );
    }

    function madridClock(scoreDay, utcHour) {
      if (typeof utcHour !== "number" || !scoreDay) return "";
      const [y, m, d] = scoreDay.split("-").map(Number);
      for (const delta of [0, -1, 1]) {
        const dt = new Date(Date.UTC(y, m - 1, d + delta, utcHour));
        const md = dt.toLocaleString("sv-SE", { timeZone: "Europe/Madrid" }).slice(0, 10);
        if (md === scoreDay) {
          return dt.toLocaleString(localeTag(), {
            timeZone: "Europe/Madrid",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          });
        }
      }
      return `${String(utcHour).padStart(2, "0")}:00`;
    }

    function scoreColor(score) {
      const s = Math.max(0, Math.min(100, Number(score))) / 100;
      const fria = [224, 82, 82];
      const templada = [232, 196, 48];
      const calida = [61, 186, 110];
      const lerp = (a, b, t) => a.map((c, i) => Math.round(c + (b[i] - c) * t));
      const rgb = s < 0.5 ? lerp(fria, templada, s / 0.5) : lerp(templada, calida, (s - 0.5) / 0.5);
      return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
    }

    function iconSvg(name) {
      const paths = {
        indice:
          '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        clock:
          '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',
        water:
          '<path d="M12 3s7 8 7 12a7 7 0 1 1-14 0c0-4 7-12 7-12z"/>',
        air: '<path d="M14 4v16M10 8h4M10 16h4"/><path d="M14 8a2.5 2.5 0 1 1 0 5"/>',
        wind: '<path d="M3 10h11a3 3 0 1 0-3-3M3 14h8a2.5 2.5 0 1 1-2.5 2.5"/>',
        waves: '<path d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/>',
        rain: '<path d="M8 6a5 5 0 0 1 9 3h1a3.5 3.5 0 1 1 0 7H7a4 4 0 0 1-1-7.9"/><path d="M8 18v2M12 17v3M16 18v2"/>',
        sky: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
        sea: '<path d="M3 13c2 2 4 2 6 0s4-2 6 0 4 2 6 0M3 18c2 2 4 2 6 0s4-2 6 0 4 2 6 0"/>',
        dogs:
          '<path d="M180-475q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29Zm180-160q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29Zm240 0q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29Zm180 160q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29ZM266-75q-45 0-75.5-34.5T160-191q0-53 36-91.5t88-53.5q41-10 81.5-14.5T446-355q41 0 81 4.5T608-336q52 15 88 53.5T732-191q0 47-30.5 81.5T626-75H266Z"/>',
      };
      const d = paths[name];
      if (!d) return "";
      if (name === "dogs") {
        return `<svg class="ico" viewBox="120 -780 720 740" aria-hidden="true" width="1em" height="1em" fill="currentColor">${d}</svg>`;
      }
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    }

    function partQual(n) {
      if (n >= 80) return t("partBien");
      if (n >= 60) return t("partAbove");
      if (n >= 40) return t("partRegular");
      if (n >= 20) return t("partBelow");
      return t("partMal");
    }

    function scorePartLabel(key) {
      const map = {
        water: "scoreWater",
        air: "scoreAir",
        wind: "scoreWind",
        waves: "scoreWaves",
        rain: "scoreRain",
        sky: "scoreSky",
      };
      return t(map[key] || key);
    }

    function scorePartTip(key) {
      const map = {
        water: "tipWater",
        air: "tipAir",
        wind: "tipWind",
        waves: "tipWaves",
        rain: "tipRain",
        sky: "tipSky",
      };
      return t(map[key] || key);
    }

    function scoreBar(icon, key, value) {
      const label = scorePartLabel(key);
      const q = partQual(value);
      const tip = scorePartTip(key);
      const pct = Math.max(0, Math.min(100, value));
      const pos = SCORE_PART_LESS_BETTER.includes(key) ? 100 - pct : pct;
      const color = scoreColor(value);
      return `<li class="score-bar"><div class="bar-label">${iconSvg(icon)}<button type="button" class="hint bar-hint" data-kind="part-${key}" data-tip="${escapeAttr(
        tip
      )}" aria-label="${escapeAttr(label)}">${label} <span class="bar-qual">${q}</span></button></div><span class="bar-track"><span class="bar" role="img" aria-label="${escapeAttr(
        `${label}: ${q}`
      )}"><span class="bar-fill" style="width:${pos}%;background:${color}"></span></span><span class="bar-mark" style="--pos:${pos};background:${color}"></span></span></li>`;
    }

    function uvMap(beach) {
      const mgSrc = (beach.sources || []).find((s) => s.name === "MeteoGalicia");
      const uvDays = new Map();
      if (!mgSrc) return uvDays;
      for (const d of [...(mgSrc.history || []), ...(mgSrc.days || [])]) {
        if (d && d.date && typeof d.uv === "number") uvDays.set(d.date, d.uv);
      }
      return uvDays;
    }

    function cardBackHtml(beach) {
      const costaSrc =
        beach.source && beach.source !== "Copernicus"
          ? (beach.sources || []).find((s) => s.name === beach.source)
          : null;
      const marSrc = (beach.sources || []).find((s) => s.name === "Copernicus");
      const costaDays = seriesByDay(costaSrc);
      const marDays = seriesByDay(marSrc);
      const uvDays = uvMap(beach);
      const allDates = [
        ...new Set([...costaDays.keys(), ...marDays.keys(), ...uvDays.keys()]),
      ].sort();
      const histDates = allDates.filter((d) => d < refDay);
      const futDates = allDates.filter((d) => d > refDay);
      const facts = [];
      if (typeof beach.score === "number") {
        const parts = beach.scoreParts || {};
        for (const k of SCORE_PART_KEYS) {
          if (typeof parts[k] === "number") {
            facts.push(scoreBar(SCORE_PART_ICONS[k], k, parts[k]));
          }
        }
        const best = madridClock(beach.scoreDay, beach.bestHour);
        facts.push(factItem("clock", t("mejorHora"), best || "—", "tipMejorHora", "mejorHora"));
        if (
          beach.scoreWindow &&
          beach.scoreWindow.from !== beach.scoreWindow.to
        ) {
          const win = `${madridClock(beach.scoreDay, beach.scoreWindow.from)}–${madridClock(beach.scoreDay, beach.scoreWindow.to)}`;
          facts.push(factItem("clock", t("ventana"), win || "—", "tipVentana", "ventana"));
        }
      }
      const mar = marOf(beach);
      if (mar) {
        facts.push(
          `<li class="fact-figure">${iconSvg("sea")}<span class="fact-figure-body"><span>${t("mar")} ${fmtT(mar.t)} °C</span>${natureBtn(
            beach,
            "Copernicus"
          )}</span></li>`
        );
      }
      const bits = [];
      if (facts.length) bits.push(`<ul class="card-facts">${facts.join("")}</ul>`);
      const todayUv = uvDays.get(refDay);
      if (typeof todayUv === "number" && todayUv >= 8) {
        bits.push(`<p class="uv-warn">${t("uvWarn")}</p>`);
      }
      const tables = [
        accordionTable(t("hist"), histDates, costaDays, marDays, uvDays, costaSrc ? beach.source : ""),
        accordionTable(t("forecast"), futDates, costaDays, marDays, uvDays, costaSrc ? beach.source : "", beach.scoreByDay || {}),
      ].join("");
      if (tables) bits.push(tables);
      return bits.join("");
    }

    function figureChrome(beach, sourceName) {
      if (disagree(beach)) {
        return { kind: "status", tip: disagreeText(beach), aria: t("hintDisagree") };
      }
      if (typeof beach.t !== "number" && (beach.sources || []).length) {
        return { kind: "status", tip: dashTip(beach), aria: t("hintNodata") };
      }
      return {
        kind: "nature",
        tip: t("segun", { name: sourceName || "—" }),
        aria: t("tempNature"),
      };
    }

    function natureBtn(beach, sourceName) {
      const c = figureChrome(beach, sourceName);
      return `<button type="button" class="hint card-score-label" data-kind="${c.kind}" data-tip="${escapeAttr(
        c.tip
      )}" aria-label="${escapeAttr(c.aria)}">${t("tempNature")}</button>`;
    }

    function factItem(icon, label, value, tipKey, kind) {
      if (tipKey) {
        return `<li>${iconSvg(icon)}<span><button type="button" class="hint bar-hint" data-kind="${kind}" data-tip="${escapeAttr(
          t(tipKey)
        )}" aria-label="${escapeAttr(label)}">${label}</button> ${value}</span></li>`;
      }
      return `<li>${iconSvg(icon)}<span>${label} ${value}</span></li>`;
    }

    function escapeAttr(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function withScore(beach) {
      if (typeof beach.score === "number") return beach;
      const g = (index.geo || []).find((x) => x.slug === beach.slug);
      if (g && typeof g.score === "number") return { ...beach, score: g.score };
      return beach;
    }

    function mapsQuery(beach) {
      if (typeof beach.lat === "number" && typeof beach.lon === "number") {
        return encodeURIComponent(`${beach.lat},${beach.lon}`);
      }
      const g = (index.geo || []).find((x) => x.slug === beach.slug);
      if (g && typeof g.lat === "number" && typeof g.lon === "number") {
        return encodeURIComponent(`${g.lat},${g.lon}`);
      }
      const concello = beachConcelloLabel(beach);
      return encodeURIComponent(`${beach.name}, ${concello}, Galicia`);
    }

    function beachHasDogs(beach) {
      return !!(beach && beach.slug && dogsBySlug.has(beach.slug));
    }

    function dogsNoteHtml() {
      const link = `<a href="${DOGS_POST}" rel="noopener" target="_blank">${escapeAttr(
        t("dogsLink")
      )}</a>`;
      return t("dogsNote", { link });
    }

    function cardHtml(beach, { showConcello = false } = {}) {
      beach = withScore(beach);
      const hasT = typeof beach.t === "number";
      const hasScore = typeof beach.score === "number";
      const band = hasT ? bandFor(beach.t) : null;
      const bandCls = band ? band.cls : "";
      let tipBtn = "";
      if (hasT) {
        tipBtn = natureBtn(beach, beach.source);
      } else if ((beach.sources || []).length) {
        tipBtn = `<button type="button" class="hint" data-kind="status" data-tip="${escapeAttr(
          dashTip(beach)
        )}" aria-label="${escapeAttr(t("hintNodata"))}">?</button>`;
      }
      const trendName = hasT ? trendLabel(beach.trend) : "";
      const g = hasT ? trendGlyph(beach.trend) : "";
      const trend = g
        ? `<span class="trend" aria-label="${escapeAttr(trendName)}">${g}</span>`
        : "";
      const open = currentBeach === beach.slug;
      const tempHtml = hasT
        ? `<span class="temp ${bandCls}"><span class="card-temp">${fmtT(beach.t)}</span><span class="card-temp-unit">°C</span>${trend}</span>`
        : `<span class="card-temp">—</span>`;
      const concello = beachConcelloLabel(beach);
      const q = mapsQuery(beach);
      let city = "";
      if (showConcello && concello) {
        const kmBit =
          typeof beach.km === "number"
            ? ` · ${t("kmAway", { n: Number(beach.km).toLocaleString(localeTag(), { minimumFractionDigits: 1, maximumFractionDigits: 1 }) })}`
            : "";
        city = `<span class="card-city">${concello}${kmBit}</span>`;
      }
      const nameId = `name-${beach.slug}`;
      const scoreLabel = `<button type="button" class="hint card-score-label" data-kind="indice" data-tip="${escapeAttr(
        t("tipIndice")
      )}" aria-label="${escapeAttr(t("indiceLabel"))}">${t("indiceLabel")}</button>`;
      const scoreHtml = hasScore
        ? `<span class="card-score" style="color:${scoreColor(
            beach.score
          )}" aria-label="${escapeAttr(t("indiceAria", { n: beach.score }))}">${beach.score}</span>${scoreLabel}`
        : `<span class="card-score" aria-label="${escapeAttr(
            t("indiceNa")
          )}">—</span>${scoreLabel}`;
      const dogs = beachHasDogs(beach)
        ? `<button type="button" class="hint dogs-badge" data-kind="dogs" data-tip="${escapeAttr(
            t("dogsTip")
          )}" aria-label="${escapeAttr(t("dogsAria"))}">${iconSvg("dogs")}</button>`
        : "";
      return `<li>
        <article class="card ${bandCls}${open ? " is-open" : ""}" data-slug="${beach.slug}">
          <button type="button" class="card-hit" data-slug="${beach.slug}" aria-labelledby="${nameId}" aria-haspopup="dialog" aria-expanded="${
            open ? "true" : "false"
          }"></button>
          <div class="card-head">
            <div class="card-ident">
              <div class="card-name" id="${nameId}">${beach.name}</div>
              ${city}
            </div>
            <div class="card-actions">
              ${dogs}
              <a class="maps" target="_blank" rel="noopener" data-slug="${beach.slug}" href="https://www.google.com/maps/search/?api=1&amp;query=${q}">${t("maps")}</a>
            </div>
          </div>
          <div class="card-metrics">
            <div class="card-temp-cluster">
              ${tempHtml}
              ${tipBtn}
            </div>
            <div class="card-score-cluster">${scoreHtml}</div>
          </div>
        </article>
      </li>`;
    }

    function sortBeaches(items) {
      const key = listOrd === "indice" ? "score" : "t";
      return [...items].map(withScore).sort((a, b) => {
        const av = a[key];
        const bv = b[key];
        const aOk = typeof av === "number";
        const bOk = typeof bv === "number";
        if (aOk && bOk && bv !== av) return bv - av;
        if (aOk !== bOk) return aOk ? -1 : 1;
        return a.name.localeCompare(b.name, localeTag());
      });
    }

    function renderBanded(beaches, { showConcello = false, cap = null } = {}) {
      const withT = beaches.filter((b) => typeof b.t === "number");
      const withoutT = beaches.filter(
        (b) =>
          typeof b.t !== "number" &&
          ((b.sources || []).length || typeof b.score === "number")
      );
      const sorted = sortBeaches(withT);
      let shown = sorted;
      let hidden = 0;
      if (cap && sorted.length > cap && !concelloShowAll) {
        const openIdx = currentBeach
          ? sorted.findIndex((b) => b.slug === currentBeach)
          : -1;
        if (openIdx < cap) {
          shown = sorted.slice(0, cap);
          hidden = sorted.length - cap;
        }
      }
      const parts = [];
      if (shown.length) {
        const byBand = { calida: [], templada: [], fria: [] };
        for (const b of shown) {
          const band = bandFor(b.t);
          byBand[band.id].push(b);
        }
        for (const band of BANDS) {
          const items = byBand[band.id];
          if (!items.length) continue;
          const titleKey =
            band.id === "calida"
              ? "bandCalida"
              : band.id === "templada"
                ? "bandTemplada"
                : "bandFria";
          parts.push(
            `<h3>${t(titleKey)}</h3><ul class="beach-list">${items
              .map((b) => cardHtml(b, { showConcello }))
              .join("")}</ul>`
          );
        }
      }
      if (hidden) {
        parts.push(
          `<button type="button" class="show-more" id="show-more">${t("showMore", {
            n: hidden,
          })}</button>`
        );
      }
      if (withoutT.length) {
        const items = [...withoutT].sort((a, b) =>
          a.name.localeCompare(b.name, localeTag())
        );
        parts.push(
          `<section><h3>${t("sinDatoHoy")}</h3><ul class="beach-list">${items
            .map((b) => cardHtml(b, { showConcello }))
            .join("")}</ul></section>`
        );
      }
      return parts;
    }

    function bindList(root) {
      root.querySelectorAll("button.card-hit").forEach((btn) => {
        btn.addEventListener("click", () => {
          const slug = btn.dataset.slug;
          if (!slug) return;
          if (currentBeach === slug) closeBeach();
          else {
            const from = caninasMode ? "caninas" : geoMode ? "geo" : undefined;
            openBeach(slug, { from });
          }
        });
      });
      root.querySelectorAll("button.hint").forEach(bindHint);
      root.querySelectorAll("a.maps").forEach((a) => {
        a.addEventListener("click", () => {
          track("maps_open", { slug: a.dataset.slug });
        });
      });
      const more = root.querySelector("#show-more");
      if (more) {
        more.addEventListener("click", () => {
          concelloShowAll = true;
          renderLists();
        });
      }
    }

    function findOpenBeach() {
      if (!currentBeach) return null;
      if (caninasMode) {
        return caninasResults.find((b) => b.slug === currentBeach) || null;
      }
      if (geoMode) {
        return geoResults.find((b) => b.slug === currentBeach) || null;
      }
      if (currentConcello) {
        const payload = concelloCache.get(currentConcello);
        return (
          (payload && payload.beaches || []).find((b) => b.slug === currentBeach) ||
          null
        );
      }
      return (index.top || []).find((b) => b.slug === currentBeach) || null;
    }

    function fillBeachDialog(beach) {
      const title = document.getElementById("beach-dialog-title");
      const maps = document.getElementById("beach-dialog-maps");
      const body = document.getElementById("beach-dialog-body");
      title.textContent = beach.name;
      maps.href = `https://www.google.com/maps/search/?api=1&query=${mapsQuery(beach)}`;
      maps.dataset.slug = beach.slug;
      maps.textContent = t("maps");
      let badge = document.getElementById("beach-dialog-dogs");
      if (!badge) {
        badge = document.createElement("button");
        badge.id = "beach-dialog-dogs";
        badge.type = "button";
        badge.className = "hint dogs-badge";
        badge.dataset.kind = "dogs";
        title.after(badge);
        bindHint(badge);
      }
      if (beachHasDogs(beach)) {
        badge.hidden = false;
        badge.dataset.tip = t("dogsTip");
        badge.setAttribute("aria-label", t("dogsAria"));
        badge.innerHTML = `${iconSvg("dogs")}<span>${t("dogsBadge")}</span>`;
      } else {
        badge.hidden = true;
        badge.innerHTML = "";
      }
      const note = beachHasDogs(beach)
        ? `<p class="dialog-dogs">${dogsNoteHtml()}</p>`
        : "";
      body.innerHTML = note + cardBackHtml(beach);
      body.querySelectorAll("button.hint").forEach(bindHint);
    }

    function showBeachDialog(beach) {
      fillBeachDialog(beach);
      const dlg = document.getElementById("beach-dialog");
      if (!dlg.open) dlg.showModal();
    }

    async function enrichTopBeach(beach) {
      if ((beach.sources || []).some((s) => s.history)) return beach;
      const cslug = index.beachConcello[beach.slug] || beach.concelloSlug;
      if (!cslug) return beach;
      try {
        const payload = await loadConcello(cslug);
        const full = (payload.beaches || []).find((b) => b.slug === beach.slug);
        if (full) {
          return {
            ...beach,
            ...full,
            concello: beach.concello || beachConcelloLabel(beach),
            concelloSlug: cslug,
          };
        }
      } catch (_) {
        /* keep slim */
      }
      return beach;
    }

    function buildCaninasResults() {
      const geoBySlug = new Map((index.geo || []).map((b) => [b.slug, b]));
      const out = [];
      for (const [slug, meta] of dogsBySlug) {
        const g = geoBySlug.get(slug) || {};
        out.push({
          slug,
          name: g.name || meta.name,
          concello: g.concello || meta.concello,
          concelloSlug: g.concelloSlug || meta.concelloSlug,
          t: g.t,
          score: g.score,
          scoreParts: g.scoreParts,
          trend: g.trend,
          dogs: true,
        });
      }
      return out;
    }

    function syncCaninasToggle() {
      const btn = document.getElementById("caninas-toggle");
      if (btn) btn.setAttribute("aria-pressed", caninasMode ? "true" : "false");
    }

    async function renderLists() {
      const root = document.getElementById("lists");
      const dlg = document.getElementById("beach-dialog");
      if (!currentBeach && dlg.open) dlg.close();
      syncCaninasToggle();

      if (caninasMode) {
        caninasResults = buildCaninasResults();
        if (currentBeach) {
          const idx = caninasResults.findIndex((b) => b.slug === currentBeach);
          if (idx >= 0) {
            caninasResults[idx] = await enrichTopBeach(caninasResults[idx]);
          }
        }
        const items = sortBeaches(caninasResults)
          .map((b) => cardHtml(b, { showConcello: true }))
          .join("");
        root.innerHTML = items
          ? `<h2>${t("caninasTitle")}</h2><ul class="beach-list">${items}</ul>`
          : `<h2>${t("caninasTitle")}</h2><p class="empty">${t("caninasEmpty")}</p>`;
        bindList(root);
        return;
      }

      if (geoMode) {
        geoResults = await Promise.all(
          geoResults.map((b) => enrichTopBeach(b))
        );
        const items = geoResults
          .map((b) => cardHtml(b, { showConcello: true }))
          .join("");
        root.innerHTML = `<h2>${t("playasCercanas")}</h2><ul class="beach-list">${items}</ul>`;
        bindList(root);
        return;
      }

      if (currentConcello === null) {
        if (currentBeach) {
          const idx = (index.top || []).findIndex((b) => b.slug === currentBeach);
          if (idx >= 0) {
            index.top[idx] = await enrichTopBeach(index.top[idx]);
          }
        }
        const parts = renderBanded(index.top || [], { showConcello: true });
        const title = listOrd === "indice" ? t("mejorIndice") : t("masCalidas");
        root.innerHTML = parts.length
          ? `<h2>${title}</h2>${parts.join("")}`
          : `<p class="empty">${t("sinDestacadas")}</p>`;
        bindList(root);
        return;
      }

      if (!concelloCache.has(currentConcello)) {
        root.innerHTML = `<p class="empty">${t("cargando")}</p>`;
      }

      let payload;
      try {
        payload = await loadConcello(currentConcello);
      } catch (err) {
        root.innerHTML = `<p class="empty">${t("noLoadConcello", {
          slug: currentConcello,
          err: err.message,
        })}</p>`;
        return;
      }
      const beaches = payload.beaches || [];
      const parts = renderBanded(beaches, {
        showConcello: false,
        cap: CONCELLO_FACE_CAP,
      });
      root.innerHTML =
        parts.join("") || `<p class="empty">${t("noConcelloData")}</p>`;
      bindList(root);
    }

    async function openBeach(slug, { push = true, from } = {}) {
      currentBeach = slug;
      if (push) {
        const src =
          from ||
          (caninasMode
            ? "caninas"
            : geoMode
              ? "geo"
              : currentConcello
                ? "concello"
                : "top");
        track("beach_open", { slug, from: src });
        if (currentConcello && !geoMode && !caninasMode) {
          setUrl({ c: currentConcello, b: slug });
        }
      }
      await renderLists();
      const beach = findOpenBeach();
      if (beach) showBeachDialog(beach);
    }

    function closeBeach({ push = true } = {}) {
      const slug = currentBeach;
      currentBeach = null;
      hideTip();
      if (push && !geoMode && !caninasMode) {
        if (currentConcello === null) setUrl({});
        else setUrl({ c: currentConcello });
      }
      const dlg = document.getElementById("beach-dialog");
      if (dlg.open) dlg.close();
      renderLists();
      if (slug) {
        const hit = document.querySelector(
          `.card[data-slug="${CSS.escape(slug)}"] .card-hit`
        );
        if (hit) hit.focus();
      }
    }

    async function bootFromQuery() {
      const { c, b, ord, lang: qLang } = parseQuery();
      applyListOrd(ord);
      applyLang(qLang || readStoredLang() || "es");
      if (b && index.beachConcello[b]) {
        currentConcello = index.beachConcello[b];
      } else if (c) {
        currentConcello = c;
      } else {
        currentConcello = null;
      }
      ensureConcelloReady();
      if (!c && !b) track("top_view");
      if (b) await openBeach(b, { push: false });
      else await renderLists();
    }

    const concelloInput = document.getElementById("concello");
    const concelloList = document.getElementById("concello-listbox");
    const concelloClear = document.getElementById("concello-clear");

    concelloClear.addEventListener("click", (e) => {
      e.preventDefault();
      clearConcello();
    });

    const beachDialog = document.getElementById("beach-dialog");
    document.getElementById("beach-dialog-close").addEventListener("click", () => {
      closeBeach();
    });
    document.getElementById("beach-dialog-maps").addEventListener("click", () => {
      track("maps_open", { slug: document.getElementById("beach-dialog-maps").dataset.slug });
    });
    beachDialog.addEventListener("click", (e) => {
      if (e.target === beachDialog) closeBeach();
    });
    beachDialog.addEventListener("close", () => {
      if (currentBeach) closeBeach();
    });

    function changeListOrd(ord) {
      applyListOrd(ord);
      if (geoMode && lastGeo) {
        geoResults = nearbyBeaches(lastGeo.lat, lastGeo.lon);
      }
      setUrl(currentUrlParams());
      renderLists();
    }

    document.getElementById("sort-bar").addEventListener("click", (e) => {
      const btn = e.target.closest("[role='radio']");
      if (!btn || !btn.dataset.ord) return;
      changeListOrd(btn.dataset.ord);
    });
    function changeLang(next) {
      applyLang(next);
      writeStoredLang(lang);
      setUrl(currentUrlParams());
      renderLists();
      if (currentBeach) {
        const beach = findOpenBeach();
        if (beach) fillBeachDialog(beach);
      }
    }

    document.getElementById("lang-bar").addEventListener("click", (e) => {
      const btn = e.target.closest("[role='radio']");
      if (!btn || !btn.dataset.lang) return;
      changeLang(btn.dataset.lang);
    });
    document.getElementById("lang-bar").addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft" && e.key !== "ArrowDown" && e.key !== "ArrowUp") {
        return;
      }
      const radios = [
        ...document.getElementById("lang-bar").querySelectorAll("[role='radio']"),
      ];
      if (!radios.length) return;
      e.preventDefault();
      const i = radios.findIndex((b) => b.dataset.lang === lang);
      const next = radios[(i + (e.key === "ArrowLeft" || e.key === "ArrowUp" ? radios.length - 1 : 1)) % radios.length];
      next.focus();
      changeLang(next.dataset.lang);
    });

    document.getElementById("caninas-toggle").addEventListener("click", async () => {
      caninasMode = !caninasMode;
      if (caninasMode) {
        geoMode = false;
        currentConcello = null;
        currentBeach = null;
        setGeoStatus("");
        setConcelloInput();
        closeCombo();
        hideTip();
        setUrl({});
      } else {
        currentBeach = null;
        hideTip();
        setUrl({});
        track("top_view");
      }
      syncCaninasToggle();
      await renderLists();
    });

    document.getElementById("sort-bar").addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft" && e.key !== "ArrowDown" && e.key !== "ArrowUp") {
        return;
      }
      const radios = [
        ...document.getElementById("sort-bar").querySelectorAll("[role='radio']"),
      ];
      if (!radios.length) return;
      e.preventDefault();
      const i = radios.findIndex((b) => b.dataset.ord === listOrd);
      const next = radios[(i + (e.key === "ArrowLeft" || e.key === "ArrowUp" ? radios.length - 1 : 1)) % radios.length];
      next.focus();
      changeListOrd(next.dataset.ord);
    });

    document.getElementById("geo-near").addEventListener("click", () => {
      caninasMode = false;
      syncCaninasToggle();
      if (!navigator.geolocation) {
        geoMode = false;
        geoResults = [];
        setGeoStatus(t("geoFail"));
        renderLists();
        return;
      }
      setGeoStatus(t("geoGetting"));
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const near = nearbyBeaches(pos.coords.latitude, pos.coords.longitude);
          if (!near.length) {
            geoMode = false;
            geoResults = [];
            lastGeo = null;
            setGeoStatus(t("geoNone"));
            await renderLists();
            return;
          }
          lastGeo = {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
          };
          currentConcello = null;
          setConcelloInput();
          setGeoStatus("");
          geoMode = true;
          caninasMode = false;
          geoResults = near;
          currentBeach = null;
          await renderLists();
        },
        async () => {
          geoMode = false;
          geoResults = [];
          lastGeo = null;
          setGeoStatus(t("geoFail"));
          await renderLists();
        }
      );
    });

    concelloInput.addEventListener("focus", () => {
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("click", () => {
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("input", () => {
      syncClearButton();
      renderComboOptions(concelloInput.value);
    });

    concelloInput.addEventListener("keydown", async (e) => {
      const open = concelloInput.getAttribute("aria-expanded") === "true";
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!open) renderComboOptions(concelloInput.value);
        setComboActive(comboActive + 1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (!open) renderComboOptions(concelloInput.value);
        setComboActive(comboActive - 1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (comboActive >= 0 && comboFiltered[comboActive]) {
          await selectConcello(comboFiltered[comboActive].slug);
        } else {
          const hits = filterConcellos(concelloInput.value);
          const exact = hits.find(
            (c) =>
              c.name.toLowerCase() === concelloInput.value.trim().toLowerCase()
          );
          if (exact) await selectConcello(exact.slug);
          else if (hits.length === 1) await selectConcello(hits[0].slug);
          else {
            setConcelloInput();
            closeCombo();
          }
        }
      } else if (e.key === "Escape") {
        e.preventDefault();
        setConcelloInput();
        closeCombo();
      }
    });

    concelloList.addEventListener("mousedown", (e) => {
      const opt = e.target.closest('[role="option"]');
      if (!opt) return;
      e.preventDefault();
      selectConcello(opt.dataset.slug);
    });

    concelloInput.addEventListener("blur", () => {
      window.setTimeout(() => {
        if (document.activeElement === concelloInput) return;
        if (document.activeElement === concelloClear) return;
        setConcelloInput();
        closeCombo();
      }, 120);
    });

    window.addEventListener("popstate", async () => {
      geoMode = false;
      caninasMode = false;
      setGeoStatus("");
      const { c, b, ord, lang: qLang } = parseQuery();
      applyListOrd(ord);
      applyLang(qLang || readStoredLang() || "es");
      if (b && index.beachConcello[b]) currentConcello = index.beachConcello[b];
      else if (c) currentConcello = c;
      else currentConcello = null;
      setConcelloInput();
      closeCombo();
      if (b) await openBeach(b, { push: false });
      else {
        currentBeach = null;
        hideTip();
        await renderLists();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      hideTip();
      if (currentBeach) closeBeach();
    });
    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".combo")) return;
      if (concelloInput.getAttribute("aria-expanded") === "true") {
        setConcelloInput();
        closeCombo();
      }
      if (!tipOpen) return;
      const tip = document.getElementById("tip");
      if (e.target.closest(".hint") || tip.contains(e.target)) return;
      hideTip();
    });

    function loadCatalogDogs(json) {
      dogsBySlug.clear();
      for (const b of json.beaches || []) {
        if (b && b.dogs && b.slug) {
          dogsBySlug.set(b.slug, {
            name: b.name,
            concello: b.concello,
            concelloSlug: b.concelloSlug,
          });
        }
      }
    }

    Promise.all([
      fetch("./data/index.json", { cache: "no-store" }).then((r) => {
        if (!r.ok) throw new Error(`${r.status}`);
        return r.json();
      }),
      fetch("./catalog.json", { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .catch(() => null),
    ])
      .then(async ([json, catalog]) => {
        index = json;
        if (!index.top) index.top = [];
        if (!index.geo) index.geo = [];
        if (catalog) loadCatalogDogs(catalog);
        refDay = dayOf(index.fetchedAt);
        document.getElementById("fetchedAt").textContent = index.fetchedAt || "—";
        await bootFromQuery();
      })
      .catch((err) => {
        applyLang(parseQuery().lang || readStoredLang() || "es");
        document.getElementById("lists").innerHTML =
          `<p class="empty">${t("noIndex", { err: err.message })}</p>`;
      });
  </script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="d4689bbc-a673-4072-a3e0-5c8a7b5f16c9"></script>
